<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculs Posés & Décompositions - Classe Adaptative</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #cbd5e1; overflow-x: hidden; }
        
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"], input[type="text"] { -moz-appearance: textfield; }

        /* Animation Flip 3D (Corrigée pour l'opacité) */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        /* Forcer l'invisibilité de la face arrière de chaque côté */
        .front, .back { 
            backface-visibility: hidden; 
            -webkit-backface-visibility: hidden; /* Safari */
            background-color: white; /* Opacité stricte */
        }
        .back { z-index: 10; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flipper { transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .flipped .flipper { transform: rotateY(180deg); }

        /* Cellules strictes pour l'alignement mathématique */
        .grid-math { display: grid; gap: 0.2rem; justify-items: center; align-items: center; font-family: 'Courier New', Courier, monospace; margin: 0 auto; }
        .cell-input { width: 2.2rem; height: 2.5rem; text-align: center; font-weight: 800; border: 2px solid #cbd5e1; border-radius: 0.4rem; background: white; color: #1e293b; transition: all 0.2s;}
        .cell-input:focus { border-color: #960018; outline: none; box-shadow: 0 0 0 3px rgba(150, 0, 24, 0.2); }
        .cell-static { width: 2.2rem; text-align: center; font-weight: 800; color: #1e293b;}
        .cell-carry { width: 1.8rem; height: 1.8rem; border-radius: 50%; border: 2px solid #e2e8f0; font-size: 0.9rem; font-weight: 700; text-align: center; background: #f8fafc; color: #ef4444;}
        .cell-carry:focus { border-color: #ef4444; outline: none; }

        /* Nouveaux styles spécifiques pour l'arbre de calcul */
        .tree-node-input { width: 4.5rem; height: 2rem; text-align: center; font-weight: bold; font-size: 0.9rem; border: 2px solid #94a3b8; border-radius: 0.5rem; background: white; color: #1e293b; }
        .tree-node-input:focus { border-color: #3b82f6; outline: none; }
        .tree-node-static { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 0.2rem 0.5rem; border-radius: 0.5rem; font-weight: bold; font-size: 0.8rem; color: #475569; white-space: nowrap; }
        .tree-node-correct { background: #d1fae5; border: 2px solid #10b981; color: #065f46; font-weight: 900; }
        .tree-vert-line { width: 2px; background-color: #94a3b8; margin: 2px auto;}
        .tree-horiz-line { height: 3px; background-color: #94a3b8; position: absolute; z-index: 1; border-radius: 2px; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body class="h-screen flex flex-col text-slate-800">

    <!-- HEADER GLOBAL -->
    <header class="bg-[#960018] text-white flex justify-between items-center px-6 py-4 shadow-md z-20 shrink-0">
        <div class="flex items-center gap-4">
            <div class="bg-white/20 p-2 rounded-xl"><i class="fa-solid fa-calculator text-2xl w-8 h-8 flex justify-center items-center"></i></div>
            <div>
                <h1 class="text-2xl font-black uppercase tracking-wide">Calculs posés & Décompositions</h1>
                <p class="text-sm font-semibold tracking-widest text-white/80 uppercase">Classe Adaptative</p>
            </div>
        </div>
        <div class="flex bg-white/10 rounded-full p-1 border border-white/20 font-bold text-sm" id="players-selector">
            <button data-players="1" class="player-btn px-6 py-2 rounded-full bg-white text-[#960018] shadow transition">INDIVIDUEL</button>
            <button data-players="2" class="player-btn px-6 py-2 rounded-full hover:bg-white/20 text-white transition">DUEL</button>
            <button data-players="3" class="player-btn px-6 py-2 rounded-full hover:bg-white/20 text-white transition hidden md:block">TRIPLE</button>
            <button data-players="4" class="player-btn px-6 py-2 rounded-full hover:bg-white/20 text-white transition">ÉQUIPE</button>
        </div>
    </header>

    <!-- BARRE DE MODE & TIMER -->
    <div class="bg-white shadow-sm border-b border-slate-200 px-8 py-3 flex justify-between items-center gap-4 z-10 shrink-0">
        <div class="flex space-x-1 font-bold text-sm bg-slate-100 p-1 rounded-xl" id="mode-selector">
            <button data-mode="entrainement" class="mode-btn px-6 py-2 rounded-lg bg-slate-800 text-white shadow">ENTRAÎNEMENT</button>
            <button data-mode="libre" class="mode-btn px-6 py-2 rounded-lg text-slate-500 hover:bg-slate-200 transition">LIBRE</button>
            <button data-mode="sprint" class="mode-btn px-6 py-2 rounded-lg text-slate-500 hover:bg-slate-200 transition">SPRINT</button>
        </div>
        
        <div id="global-timer" class="hidden text-[#960018] font-black text-2xl bg-red-50 px-6 py-2 rounded-xl border border-red-200 shadow-inner">
            <i class="fa-solid fa-clock mr-2 animate-pulse"></i><span>30</span>s
        </div>
    </div>

    <!-- MAIN WORKSPACE (Grille dynamique TBI) -->
    <main class="flex-1 p-4 md:p-6 flex flex-col overflow-y-auto w-full">
        <div id="cards-container" class="grid gap-4 w-full h-full pb-4 items-stretch">
            <!-- Cartes joueurs injectées ici -->
        </div>
    </main>

    <script>
        // CLE API POUR LE TUTEUR IA (Google Gemini)
        const API_KEY = "AIzaSyCGUQ6Qt-nZ-aGiEKt_TlUlHZ0sYxmVvnY";

        let globalState = { mode: 'entrainement', playersCount: 1, timer: null, timeLeft: 30 };
        let cardsData = []; 

        document.addEventListener("DOMContentLoaded", () => {
            setupGlobalListeners();
            setPlayers(1);
        });

        function setupGlobalListeners() {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.mode-btn').forEach(b => { b.classList.remove('bg-slate-800', 'text-white', 'shadow'); b.classList.add('text-slate-500'); });
                    e.target.classList.remove('text-slate-500'); e.target.classList.add('bg-slate-800', 'text-white', 'shadow');
                    globalState.mode = e.target.dataset.mode;
                    
                    document.getElementById('global-timer').classList.toggle('hidden', globalState.mode !== 'sprint');
                    if(globalState.mode === 'sprint') { startTimer(); initAllGames(); } 
                    else { stopTimer(); initAllGames(); }
                });
            });

            document.querySelectorAll('.player-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.player-btn').forEach(b => { b.classList.remove('bg-white', 'text-[#960018]', 'shadow'); b.classList.add('text-white'); });
                    e.target.classList.remove('text-white'); e.target.classList.add('bg-white', 'text-[#960018]', 'shadow');
                    setPlayers(parseInt(e.target.dataset.players));
                });
            });
        }

        // --- TIMER ---
        function startTimer() {
            stopTimer(); globalState.timeLeft = 30; updateTimerUI();
            globalState.timer = setInterval(() => {
                globalState.timeLeft--; updateTimerUI();
                if(globalState.timeLeft <= 0) { stopTimer(); for(let i=0; i<globalState.playersCount; i++) corriger(i); }
            }, 1000);
        }
        function stopTimer() { clearInterval(globalState.timer); }
        function updateTimerUI() {
            const span = document.querySelector('#global-timer span');
            if(span) span.innerText = globalState.timeLeft;
            const container = document.getElementById('global-timer');
            if(globalState.timeLeft <= 10) container.classList.replace('text-[#960018]', 'text-red-600');
            else container.classList.replace('text-red-600', 'text-[#960018]');
        }

        // --- GESTION DES CARTES MULTI-JOUEURS ---
        function setPlayers(count) {
            globalState.playersCount = count;
            const container = document.getElementById('cards-container');
            
            let gridClasses = {
                1: 'grid-cols-1 max-w-4xl mx-auto',
                2: 'grid-cols-1 lg:grid-cols-2 max-w-[98%] mx-auto',
                3: 'grid-cols-1 lg:grid-cols-3 max-w-[98%] mx-auto',
                4: 'grid-cols-1 lg:grid-cols-4 max-w-full px-2'
            };
            container.className = `grid gap-4 w-full min-h-0 ${gridClasses[count]}`;

            let newCardsData = [];
            for(let i=0; i<count; i++) {
                newCardsData.push(cardsData[i] || { n1: 0, n2: 0, ans: 0, rem: 0, op: '+', limit: 1000, type: 'entiers', format: 'pose' });
            }
            cardsData = newCardsData;

            container.innerHTML = '';
            for(let i=0; i<count; i++) container.innerHTML += createCardHTML(i);
            initAllGames();
        }

        function createCardHTML(id) {
            let c = cardsData[id];
            let opSymbol = c.op === '*' ? 'x' : (c.op === '/' ? '÷' : c.op);
            
            // Paramètres Indépendants - Hauteur fixe h-12 pour TBI
            let settingsHtml = `
                <div class="bg-slate-100 rounded-xl mb-3 flex flex-row justify-between items-center gap-1 md:gap-2 shrink-0 border border-slate-200 shadow-sm h-12 px-2 overflow-hidden">
                    <select onchange="updateCardSettings(${id}, 'op', this.value)" class="bg-white border-2 border-[#960018] text-[#960018] rounded-lg h-8 px-1 md:px-2 font-black outline-none text-sm text-center shadow-sm cursor-pointer w-12">
                        <option value="+" ${c.op==='+'?'selected':''}>+</option>
                        <option value="-" ${c.op==='-'?'selected':''}>-</option>
                        <option value="*" ${c.op==='*'?'selected':''}>x</option>
                        <option value="/" ${c.op==='/'?'selected':''}>÷</option>
                    </select>
                    <select onchange="updateCardSettings(${id}, 'format', this.value)" id="format-select-${id}" class="bg-white border border-slate-300 rounded-lg h-8 px-1 font-bold text-slate-700 outline-none text-[11px] md:text-xs flex-1 cursor-pointer">
                        <option value="pose" ${c.format==='pose'?'selected':''}>Posé</option>
                        <option value="arbre" ${c.format==='arbre'?'selected':''} ${c.op==='/'?'disabled':''}>Arbre</option>
                        <option value="trous" ${c.format==='trous'?'selected':''} ${c.op==='/'?'disabled':''}>À trous</option>
                    </select>
                    <select onchange="updateCardSettings(${id}, 'type', this.value)" class="bg-blue-50 border border-blue-200 text-blue-800 rounded-lg h-8 px-1 font-bold outline-none text-[11px] md:text-xs flex-1 cursor-pointer">
                        <option value="entiers" ${c.type==='entiers'?'selected':''}>Entiers</option>
                        <option value="decimaux" ${c.type==='decimaux'?'selected':''}>Décimaux</option>
                    </select>
                    <select onchange="updateCardSettings(${id}, 'limit', this.value)" class="bg-white border border-slate-300 rounded-lg h-8 px-1 font-bold text-slate-500 outline-none text-[10px] md:text-xs flex-1 cursor-pointer">
                        <option value="100" ${c.limit==100?'selected':''}>&lt; 100</option>
                        <option value="1000" ${c.limit==1000?'selected':''}>&lt; 1 000</option>
                        <option value="10000" ${c.limit==10000?'selected':''}>&lt; 10 000</option>
                        <option value="100000" ${c.limit==100000?'selected':''}>&lt; 100 000</option>
                        <option value="1000000" ${c.limit==1000000?'selected':''}>&lt; 1 000 000</option>
                    </select>
                    <button onclick="genererUnProbleme(${id})" class="bg-slate-800 text-white h-8 px-2 rounded-lg font-bold shadow hover:bg-slate-700 transition" title="Nouveau calcul"><i class="fa-solid fa-rotate-right"></i></button>
                </div>`;

            let libreHtml = `
                <div id="libre-inputs-${id}" class="${globalState.mode === 'libre' ? 'flex' : 'hidden'} justify-center items-center gap-2 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <input type="number" step="any" id="libre-n1-${id}" placeholder="Num 1" class="w-2/5 border-2 border-slate-300 rounded-lg p-2 text-center font-bold focus:border-[#960018] outline-none text-sm">
                    <span class="text-lg font-black" id="libre-op-symbol-${id}">${opSymbol}</span>
                    <input type="number" step="any" id="libre-n2-${id}" placeholder="Num 2" class="w-2/5 border-2 border-slate-300 rounded-lg p-2 text-center font-bold focus:border-[#960018] outline-none text-sm">
                    <button onclick="genererGrilleLibre(${id})" class="bg-[#960018] text-white px-3 py-2 rounded-lg font-bold shadow hover:bg-red-800 transition"><i class="fa-solid fa-play"></i></button>
                </div>`;

            return `
            <div class="perspective-1000 relative w-full flex-1 flex flex-col min-h-[600px]" id="card-container-${id}">
                <div class="flipper w-full h-full absolute transform-style-3d">
                    
                    <!-- FACE AVANT (Exercice) - Ajout classe 'front' et bg-white -->
                    <div class="front absolute w-full h-full bg-white rounded-3xl shadow-xl flex flex-col p-3 md:p-4 border-2 border-slate-100 overflow-hidden">
                        ${settingsHtml}
                        
                        <!-- Bandeau Noir Fixe pour alignement TBI parfait -->
                        <div class="bg-[#0f172a] rounded-xl text-white mb-3 shadow-inner h-16 flex items-center justify-center shrink-0 ${globalState.mode === 'libre' ? 'hidden' : ''}" id="banner-${id}">
                            <h2 style="font-size: clamp(16px, 3vw, 36px);" class="font-black tracking-widest text-center px-4 w-full" id="op-display-${id}">---</h2>
                        </div>
                        
                        ${libreHtml}

                        <!-- Workspace Grille/Arbre -->
                        <div id="workspace-${id}" class="flex-1 bg-slate-50 rounded-2xl border-2 border-slate-200 flex flex-col items-center justify-center p-2 overflow-x-auto overflow-y-auto custom-scrollbar relative"></div>

                        <!-- Boutons Action -->
                        <div class="flex gap-2 mt-3 shrink-0">
                            <button onclick="corriger(${id})" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white text-lg font-black py-3 rounded-xl shadow transition transform hover:-translate-y-1">VÉRIFIER</button>
                            <button onclick="vider(${id})" class="w-16 md:w-20 bg-white border-2 border-slate-200 text-red-500 hover:bg-red-50 text-base font-bold py-3 rounded-xl shadow transition"><i class="fa-solid fa-eraser"></i></button>
                        </div>
                    </div>

                    <!-- FACE ARRIÈRE (Correction Nettoyée) - Ajout classe 'back', bg-white strict et rotate-y-180 -->
                    <div class="back absolute w-full h-full bg-white rounded-3xl shadow-xl flex flex-col p-3 md:p-4 border-2 border-slate-100 rotate-y-180 overflow-hidden">
                        
                        <!-- En-tête Correction -->
                        <div class="flex justify-between items-center mb-2 shrink-0 px-2">
                            <h3 class="font-black text-xl text-slate-800 uppercase tracking-widest">Correction</h3>
                            <div id="correction-badge-${id}" class="px-4 py-1 rounded-full font-black text-sm md:text-base shadow text-white"></div>
                        </div>

                        <!-- Visuel correction avec Scale pour éviter débordement -->
                        <div class="flex-1 bg-emerald-50 border-2 border-emerald-100 rounded-xl flex flex-col items-center justify-center overflow-hidden relative p-2 min-h-[150px]">
                            <!-- On remet overflow-visible et on centre pour que l'arbre ne soit pas coupé s'il est plus petit -->
                            <div id="correct-grid-${id}" class="w-full h-full flex flex-col items-center justify-center origin-center overflow-visible" style="transform: scale(0.85);"></div>
                        </div>

                        <!-- Ligne de séparation -->
                        <hr class="border-slate-200 border-t-2 w-3/4 mx-auto my-3 rounded-full shrink-0">

                        <!-- Tuteur IA -->
                        <div class="h-[120px] md:h-[150px] bg-gradient-to-br from-blue-50 to-indigo-50 border-2 border-blue-200 rounded-xl p-3 flex flex-col relative overflow-hidden shadow-inner shrink-0">
                            <div class="flex items-center gap-2 mb-1">
                                <i class="fa-solid fa-robot text-lg text-blue-600"></i>
                                <span class="font-black text-xs text-blue-800 uppercase tracking-wider">Tuteur IA</span>
                            </div>
                            <div id="ia-feedback-${id}" class="flex-1 text-slate-700 text-sm leading-snug overflow-y-auto custom-scrollbar font-medium mt-1"></div>
                        </div>

                        <!-- Bouton Retour -->
                        <button onclick="retourner(${id})" class="mt-3 shrink-0 w-full bg-slate-900 hover:bg-slate-800 text-white text-lg font-black py-3 rounded-xl shadow transition flex items-center justify-center gap-2">
                            CONTINUER <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>`;
        }

        // --- GESTION DES REGLAGES INDIVIDUELS ---
        function updateCardSettings(id, key, value) {
            let c = cardsData[id];
            if(key === 'limit') value = parseInt(value);
            c[key] = value;
            
            if(key === 'op') {
                let formatSelect = document.getElementById(`format-select-${id}`);
                if (value === '/') {
                    formatSelect.value = 'pose'; c.format = 'pose'; formatSelect.disabled = true;
                } else {
                    formatSelect.disabled = false;
                    let optArbre = formatSelect.querySelector('option[value="arbre"]');
                    let optTrous = formatSelect.querySelector('option[value="trous"]');
                    if(optArbre) optArbre.disabled = false;
                    if(optTrous) optTrous.disabled = false;
                }
                let sym = value === '*' ? 'x' : (value === '/' ? '÷' : value);
                let opSpan = document.getElementById(`libre-op-symbol-${id}`);
                if(opSpan) opSpan.innerText = sym;
            }
            if(globalState.mode !== 'libre') genererUnProbleme(id);
        }

        function initAllGames() {
            for(let i=0; i<globalState.playersCount; i++) {
                if(globalState.mode === 'libre') {
                    document.getElementById(`workspace-${i}`).innerHTML = '<div class="text-slate-400 font-bold text-center h-full flex flex-col items-center justify-center"><i class="fa-solid fa-pen-nib text-5xl mb-4 opacity-50"></i><span>Saisissez vos nombres</span></div>';
                    document.getElementById(`banner-${i}`).classList.add('hidden');
                    document.getElementById(`libre-inputs-${i}`).classList.remove('hidden');
                    document.getElementById(`libre-inputs-${i}`).classList.add('flex');
                } else {
                    document.getElementById(`banner-${i}`).classList.remove('hidden');
                    document.getElementById(`libre-inputs-${i}`).classList.add('hidden');
                    document.getElementById(`libre-inputs-${i}`).classList.remove('flex');
                    genererUnProbleme(i);
                }
            }
        }

        function getRandom(min, max, isDec) {
            let n = Math.random() * (max - min) + min; return isDec ? parseFloat(n.toFixed(2)) : Math.floor(n);
        }

        function genererUnProbleme(id) {
            if(globalState.mode === 'libre') { vider(id); return; }
            let c = cardsData[id]; let isDec = c.type === 'decimaux';
            
            if (c.op === '+') { c.n1 = getRandom(c.limit/10, c.limit, isDec); c.n2 = getRandom(c.limit/100, c.limit, isDec); } 
            else if (c.op === '-') { c.n1 = getRandom(c.limit/10, c.limit, isDec); c.n2 = getRandom(1, c.n1, isDec); } 
            else if (c.op === '*') { 
                c.n1 = getRandom(10, c.limit/10, isDec); 
                c.n2 = c.format === 'arbre' ? getRandom(2, 9, false) : getRandom(12, 99, false); // Arbre = max 1 chiffre multiplicateur
            } 
            else if (c.op === '/') {
                c.n2 = getRandom(2, 20, false); let maxQ = Math.floor(c.limit / c.n2);
                let q = getRandom(10, Math.max(10, Math.min(999, maxQ)), false);
                c.n1 = (c.n2 * q) + Math.floor(Math.random() * c.n2);
                if(isDec) c.n1 = parseFloat((c.n1 + getRandom(0.1, 0.99, true)).toFixed(2));
            }

            calculerReponse(id);
            genererMasquesTrous(id);
            afficherBandeau(id);
            renderWorkspace(id, false);
        }

        function genererGrilleLibre(id) {
            let v1 = document.getElementById(`libre-n1-${id}`).value; let v2 = document.getElementById(`libre-n2-${id}`).value;
            if(!v1 || !v2) return alert("Saisissez les nombres.");
            cardsData[id].n1 = parseFloat(v1.replace(',', '.')); cardsData[id].n2 = parseFloat(v2.replace(',', '.'));
            
            if(cardsData[id].op === '-' && cardsData[id].n1 < cardsData[id].n2) { alert("Le premier nombre doit être plus grand."); return; }
            calculerReponse(id); genererMasquesTrous(id); renderWorkspace(id, false);
        }

        function calculerReponse(id) {
            let c = cardsData[id];
            if(c.op === '+') c.ans = c.n1 + c.n2;
            if(c.op === '-') c.ans = c.n1 - c.n2;
            if(c.op === '*') c.ans = c.n1 * c.n2;
            if(c.op === '/') {
                if(c.type === 'entiers' && Number.isInteger(c.n1)) { c.ans = Math.floor(c.n1/c.n2); c.rem = c.n1%c.n2; } 
                else { c.ans = parseFloat((c.n1/c.n2).toFixed(2)); c.rem = 0; }
            }
            if(c.op !== '/') c.ans = parseFloat(c.ans.toFixed(4));
            
            c.n1Str = c.n1.toString().replace('.', ','); c.n2Str = c.n2.toString().replace('.', ','); c.ansStr = c.ans.toString().replace('.', ',');
        }

        function genererMasquesTrous(id) {
            let c = cardsData[id];
            c.mask = { n1: [], n2: [], ans: [] };
            if (c.format === 'trous') {
                let maskRnd = (str) => {
                    let valids = []; for(let i=0; i<str.length; i++) if(str[i]!==',') valids.push(i);
                    return valids.length > 0 ? [valids[Math.floor(Math.random() * valids.length)]] : [];
                };
                c.mask.n1 = maskRnd(c.n1Str); c.mask.n2 = maskRnd(c.n2Str); c.mask.ans = maskRnd(c.ansStr);
            }
        }

        function afficherBandeau(id) {
            let c = cardsData[id];
            let sym = c.op === '*' ? 'x' : (c.op === '/' ? '÷' : c.op);
            document.getElementById(`op-display-${id}`).innerHTML = `${c.n1Str} <span class="text-[#960018] mx-2">${sym}</span> ${c.n2Str}`;
        }

        // --- MOTEUR DE RENDU (Arbre, Trous, Posé, Division) ---
        
        // Extraction par valeur positionnelle
        function getPlaceValues(str) {
            let pv = {}; let [intP, decP] = str.split(',');
            if (intP) {
                let len = intP.length;
                for(let i=0; i<len; i++) {
                    let power = len - 1 - i;
                    if(intP[i] !== '0') pv[power] = intP[i] + "0".repeat(power);
                }
            }
            if (decP) {
                for(let i=0; i<decP.length; i++) {
                    let power = -(i + 1);
                    if(decP[i] !== '0') pv[power] = "0," + "0".repeat(i) + decP[i];
                }
            }
            return pv;
        }

        function dessinerArbre(id, isCorrection) {
            let c = cardsData[id];
            let pv1 = getPlaceValues(c.n1Str); let pv2 = c.op === '*' ? {} : getPlaceValues(c.n2Str);
            
            // Tri décroissant des puissances (lecture de droite à gauche en flex-row-reverse)
            let allPowers = c.op === '*' ? 
                Object.keys(pv1).map(Number).sort((a,b) => b - a) : 
                Array.from(new Set([...Object.keys(pv1).map(Number), ...Object.keys(pv2).map(Number)])).sort((a,b) => b - a);

            let html = `<div class="flex flex-col items-center w-full font-mono gap-3 md:gap-5 py-4 overflow-x-auto custom-scrollbar relative">`;
            // Utilisation de flex-row avec justify-content-center pour garder l'ordre décroissant (Milliers à gauche, Unités à droite)
            html += `<div class="flex flex-row gap-3 md:gap-6 justify-center flex-nowrap w-full relative z-10">`;

            for(let i=0; i<allPowers.length; i++) {
                let power = allPowers[i];
                let v1 = pv1[power] || "0"; let v2 = c.op === '*' ? c.n2Str : (pv2[power] || "0");
                if (v1 === "0" && (c.op === '*' || v2 === "0")) continue;

                let partAns;
                if (c.op === '+') partAns = parseFloat(v1.replace(',','.')) + parseFloat(v2.replace(',','.'));
                else if (c.op === '-') partAns = parseFloat(v1.replace(',','.')) - parseFloat(v2.replace(',','.'));
                else if (c.op === '*') partAns = parseFloat(v1.replace(',','.')) * parseFloat(v2.replace(',','.'));

                let pAnsStr = parseFloat(partAns.toFixed(4)).toString().replace('.',',');

                // Niveau 1 : Décomposition
                let lvl1 = `<div class="text-slate-700 font-bold text-xs md:text-sm bg-white px-2 py-1 md:px-3 md:py-2 rounded-xl border border-slate-300 shadow-sm whitespace-nowrap z-10 relative">${v1} ${c.op} ${v2}</div>`;

                // Niveau 2 : Intermédiaire
                let lvl2 = isCorrection ?
                    `<div class="tree-node-correct h-8 md:h-10 min-w-[3.5rem] px-2 text-sm flex items-center justify-center z-10 relative shadow-sm rounded-lg">${pAnsStr}</div>` :
                    `<input type="text" class="tree-node-input tree-part-inp-${id} border-blue-400 h-8 md:h-10 w-16 md:w-20 text-sm md:text-base focus:border-[#960018] z-10 relative shadow-sm rounded-lg" data-expected="${pAnsStr}">`;

                html += `
                    <div class="flex flex-col items-center relative flex-1 min-w-[4rem] group-node-${id}">
                        ${lvl1}
                        <div class="tree-vert-line h-4 md:h-6"></div>
                        ${lvl2}
                        <div class="tree-vert-line h-6 md:h-8 relative"></div>
                    </div>`;
            }
            html += `</div>`; 

            // Niveau 3 : Résultat final
            let fInp = isCorrection ?
                `<div class="cell-input bg-emerald-100 border-emerald-500 text-emerald-900 w-28 md:w-36 h-10 md:h-12 flex items-center justify-center text-lg md:text-xl shadow-lg z-10 relative rounded-xl font-black">${c.ansStr}</div>` :
                `<input type="text" id="final-ans-${id}" class="cell-input border-[#960018] border-2 w-28 md:w-36 h-10 md:h-12 text-lg md:text-xl shadow-lg z-10 relative focus:border-red-600 rounded-xl" data-expected="${c.ansStr}" placeholder="Total">`;

            html += `
                <div class="flex flex-col items-center relative w-[85%] md:w-[75%] -mt-[3px]">
                    <div class="tree-horiz-line w-full top-0"></div>
                    <div class="tree-vert-line h-6 md:h-8 mb-1 relative z-10"></div>
                    ${fInp}
                </div></div>`;

            return html;
        }

        function getCols(s1, s2) {
            let p1 = s1.split(','); let p2 = s2.split(',');
            let mI = Math.max(p1[0].length, p2[0].length); let mD = Math.max((p1[1]||'').length, (p2[1]||'').length);
            return mI + mD + (mD>0?1:0) + 2; 
        }

        function dessinerGrille(id, isCorrection) {
            let c = cardsData[id];
            
            // Division Posée (Potence)
            if (c.op === '/') {
                if(isCorrection) {
                    let stepsHTML = "";
                    if(c.type === 'entiers' && Number.isInteger(c.n1)) {
                        let cur = ""; let offset = 0; let s1Str = c.n1.toString();
                        for(let i=0; i<s1Str.length; i++) {
                            cur += s1Str[i]; let val = parseInt(cur);
                            if(val >= c.n2) {
                                let sub = Math.floor(val/c.n2) * c.n2; let rem = val - sub;
                                stepsHTML += `<div class="text-red-500 font-mono text-sm mt-1 tracking-widest leading-tight">${"&nbsp;".repeat(offset)}- ${sub}</div><div class="border-t-2 border-slate-400 w-12 ml-auto mb-1"></div>`;
                                cur = rem === 0 ? "" : rem.toString();
                            }
                            offset++;
                        }
                    }
                    return `
                        <div class="flex w-full max-w-[280px] mx-auto items-start font-mono">
                            <div class="flex-1 pr-3 border-r-4 border-slate-800 text-right">
                                <div class="tracking-[0.2em] font-black text-2xl text-slate-800">${c.n1Str}</div>${stepsHTML}
                                <div class="text-emerald-700 font-bold mt-2 bg-emerald-100 inline-block px-2 rounded border border-emerald-300 text-sm">R: ${c.rem}</div>
                            </div>
                            <div class="flex-1 pl-3 flex flex-col items-start">
                                <div class="border-b-4 border-slate-800 pb-1 w-full font-black text-2xl tracking-[0.2em] text-slate-800">${c.n2Str}</div>
                                <div class="pt-2 font-black text-xl text-blue-800 tracking-widest bg-blue-100 w-full px-2 py-1 rounded">${c.ansStr}</div>
                            </div>
                        </div>`;
                } else {
                    return `
                        <div class="flex w-full font-mono max-w-[320px] mx-auto min-h-[200px]">
                            <div class="flex-1 pr-3 flex flex-col items-end border-r-4 border-slate-300 relative">
                                <div class="tracking-[0.3em] font-black text-2xl md:text-3xl mb-2 text-slate-800">${c.n1Str}</div>
                                <textarea class="w-full flex-1 bg-white border-2 border-slate-200 rounded-lg resize-none outline-none text-right text-base text-slate-600 custom-scrollbar p-2" placeholder="Sous-tractions..."></textarea>
                                <div class="mt-2 flex items-center gap-2">
                                    <span class="font-bold text-red-600 uppercase text-xs">Reste</span>
                                    <input type="number" step="any" id="rem-${id}" class="cell-input w-20 border-red-300 text-red-700 focus:border-red-600" style="height:2rem;font-size:1.1rem;">
                                </div>
                            </div>
                            <div class="flex-1 pl-3 flex flex-col relative">
                                <div class="border-b-4 border-slate-800 pb-1 font-black text-2xl md:text-3xl tracking-[0.3em] text-slate-800">${c.n2Str}</div>
                                <div class="pt-3">
                                    <input type="number" step="any" id="quo-${id}" class="cell-input w-full bg-blue-50 border-blue-300 text-blue-800 tracking-widest focus:border-blue-600 font-black" placeholder="Quotient" style="height:2.5rem;font-size:1.2rem;">
                                </div>
                            </div>
                        </div>`;
                }
            }

            // Grille avec Clamp pour grands nombres
            let cellW = globalState.playersCount >= 3 && !isCorrection ? '1.8rem' : '2.2rem';
            let cellF = 'clamp(10px, 2.5vw, 24px)';
            let cols = getCols(c.n1Str, c.n2Str);
            let html = `<div class="grid-math" style="grid-template-columns: repeat(${cols}, ${cellW});">`;

            if (c.op === '+' || c.op === '-') {
                for(let i=0; i<cols; i++) html += isCorrection ? `<div></div>` : `<input type="text" maxlength="1" class="cell-carry shadow-sm" style="width:1.5rem;height:1.5rem;font-size:0.8rem;">`;
                
                let s1Idx = cols - c.n1Str.length;
                for(let i=0; i<cols; i++) {
                    if (i >= s1Idx) {
                        let cIdx = i - s1Idx; let char = c.n1Str[cIdx];
                        if(c.format==='trous' && c.mask.n1.includes(cIdx) && !isCorrection) html += `<input type="text" maxlength="1" class="cell-input trou-inp-${id} border-orange-400 bg-orange-50" data-expected="${char}" style="width:${cellW};font-size:${cellF}">`;
                        else html += `<div class="cell-static ${char===','?'text-red-500':''}" style="width:${cellW};font-size:${cellF}">${char}</div>`;
                    } else html += `<div></div>`;
                }
                
                let s2Idx = cols - c.n2Str.length;
                for(let i=0; i<cols; i++) {
                    let border = "border-b-4 border-slate-800 pb-1 mb-1 w-full flex justify-center";
                    if(i === 0) html += `<div class="cell-static text-[#960018] ${border}" style="width:${cellW};font-size:${cellF}">${c.op}</div>`;
                    else if (i >= s2Idx) {
                        let cIdx = i - s2Idx; let char = c.n2Str[cIdx];
                        if(c.format==='trous' && c.mask.n2.includes(cIdx) && !isCorrection) html += `<div class="${border}"><input type="text" maxlength="1" class="cell-input trou-inp-${id} border-orange-400 bg-orange-50" data-expected="${char}" style="width:${cellW};font-size:${cellF};height:2rem"></div>`;
                        else html += `<div class="cell-static ${char===','?'text-red-500':''} ${border}" style="width:${cellW};font-size:${cellF}">${char}</div>`;
                    } else html += `<div class="${border}"></div>`;
                }

                let sAnsIdx = cols - c.ansStr.length;
                for(let i=0; i<cols; i++) {
                    if (i >= sAnsIdx) {
                        let cIdx = i - sAnsIdx; let char = c.ansStr[cIdx];
                        if (isCorrection) html += `<div class="cell-input border-emerald-500 bg-emerald-100 text-emerald-900 shadow flex items-center justify-center font-black" style="width:${cellW};font-size:${cellF}">${char}</div>`;
                        else if (c.format === 'trous') {
                            if (c.mask.ans.includes(cIdx)) html += `<input type="text" maxlength="1" class="cell-input trou-inp-${id} border-orange-400 bg-orange-50" data-expected="${char}" style="width:${cellW};font-size:${cellF}">`;
                            else html += `<div class="cell-static text-blue-800" style="width:${cellW};font-size:${cellF}">${char}</div>`;
                        }
                        else html += `<input type="text" maxlength="1" class="cell-input pose-inp-${id} focus:border-[#960018]" style="width:${cellW};font-size:${cellF}">`;
                    } else html += `<div></div>`;
                }
            } 
            else if (c.op === '*') {
                cols = Math.max(c.n1Str.length, c.n2Str.length) + 4;
                html = `<div class="grid-math" style="grid-template-columns: repeat(${cols}, ${cellW});">`;
                for(let i=0; i<cols; i++) html += isCorrection ? `<div></div>` : `<input type="text" maxlength="1" class="cell-carry mb-1" style="width:1.5rem;height:1.5rem;font-size:0.8rem;">`;
                
                let s1Idx = cols - c.n1Str.length;
                for(let i=0; i<cols; i++) {
                    if (i>=s1Idx) {
                        let cIdx = i-s1Idx; let char=c.n1Str[cIdx];
                        if(c.format==='trous' && c.mask.n1.includes(cIdx) && !isCorrection) html += `<input type="text" maxlength="1" class="cell-input trou-inp-${id} border-orange-400 bg-orange-50" data-expected="${char}" style="width:${cellW};font-size:${cellF};height:2rem">`;
                        else html += `<div class="cell-static ${char===','?'text-red-500':''}" style="width:${cellW};font-size:${cellF}">${char}</div>`;
                    } else html += `<div></div>`;
                }

                let s2Idx = cols - c.n2Str.length;
                for(let i=0; i<cols; i++) {
                    let border = "border-b-4 border-slate-800 pb-1 mb-1 w-full flex justify-center";
                    if(i===0) html += `<div class="cell-static text-[#960018] ${border}" style="width:${cellW};font-size:${cellF}">x</div>`;
                    else if(i>=s2Idx) {
                        let cIdx = i-s2Idx; let char=c.n2Str[cIdx];
                        if(c.format==='trous' && c.mask.n2.includes(cIdx) && !isCorrection) html += `<div class="${border}"><input type="text" maxlength="1" class="cell-input trou-inp-${id} border-orange-400 bg-orange-50" data-expected="${char}" style="width:${cellW};font-size:${cellF};height:2rem"></div>`;
                        else html += `<div class="cell-static ${char===','?'text-red-500':''} ${border}" style="width:${cellW};font-size:${cellF}">${char}</div>`;
                    } else html += `<div class="${border}"></div>`;
                }

                let s2Clean = c.n2Str.replace(',','');
                if(s2Clean.length > 1) {
                    for(let i=0; i<s2Clean.length; i++) {
                        let digit = parseInt(s2Clean[s2Clean.length - 1 - i]);
                        let prodStr = (parseInt(c.n1Str.replace(',','')) * digit).toString().padStart(cols - i, ' ');
                        for(let col=0; col<cols; col++) {
                            if(col < cols - i) {
                                let val = prodStr[col];
                                if(isCorrection || c.format==='trous') html += `<div class="cell-static text-blue-700" style="width:${cellW};font-size:${cellF}">${val?.trim()?val:''}</div>`;
                                else html += `<input type="text" maxlength="1" class="cell-input border-slate-200 bg-white" style="width:${cellW};height:2rem;font-size:${cellF}">`;
                            } else html += `<div class="cell-static text-slate-300 font-black" style="width:${cellW};font-size:${cellF}">0</div>`;
                        }
                    }
                    for(let i=0; i<cols; i++) {
                        let border = "border-t-4 border-slate-800 pt-1 mt-1 w-full flex justify-center";
                        html += i===0 ? `<div class="cell-static text-[#960018] ${border}" style="width:${cellW};font-size:${cellF}">+</div>` : `<div class="${border}"></div>`;
                    }
                }

                let sAnsIdx = cols - c.ansStr.length;
                for(let i=0; i<cols; i++) {
                    if (i >= sAnsIdx) {
                        let cIdx = i - sAnsIdx; let char = c.ansStr[cIdx];
                        if (isCorrection) html += `<div class="cell-input border-emerald-500 bg-emerald-100 text-emerald-900 shadow flex items-center justify-center font-black" style="width:${cellW};font-size:${cellF}">${char}</div>`;
                        else if (c.format === 'trous') {
                            if (c.mask.ans.includes(cIdx)) html += `<input type="text" maxlength="1" class="cell-input trou-inp-${id} border-orange-400 bg-orange-50" data-expected="${char}" style="width:${cellW};font-size:${cellF}">`;
                            else html += `<div class="cell-static text-blue-800" style="width:${cellW};font-size:${cellF}">${char}</div>`;
                        }
                        else html += `<input type="text" maxlength="1" class="cell-input pose-inp-${id} focus:border-[#960018]" style="width:${cellW};font-size:${cellF}">`;
                    } else html += `<div></div>`;
                }
            }
            html += `</div>`; return html;
        }

        function renderWorkspace(id, isCorrection) {
            let c = cardsData[id];
            const ws = document.getElementById(isCorrection ? `correct-grid-${id}` : `workspace-${id}`);
            if (c.format === 'arbre') ws.innerHTML = dessinerArbre(id, isCorrection);
            else ws.innerHTML = dessinerGrille(id, isCorrection);
        }

        function vider(id) { document.querySelectorAll(`#workspace-${id} input, #workspace-${id} textarea`).forEach(i => i.value = ''); }

        // --- VERIFICATION ET IA ---
        async function corriger(id) {
            let c = cardsData[id]; let isCorrect = false;
            let displayAns = "", displayTrue = "";

            if (c.format === 'arbre') {
                isCorrect = true;
                let partsAns = [], partsExp = [];
                let inputs = document.querySelectorAll(`#workspace-${id} input.tree-part-inp-${id}`);
                inputs.forEach(inp => { 
                    partsAns.push(inp.value.trim() || "?");
                    partsExp.push(inp.dataset.expected);
                    if(inp.value.trim() !== inp.dataset.expected) isCorrect = false; 
                });
                
                let fAns = document.getElementById(`final-ans-${id}`)?.value || "?";
                if(fAns !== c.ansStr) isCorrect = false;
                
                displayAns = `Étapes: [${partsAns.join(' | ')}] -> Total: ${fAns}`;
                displayTrue = `Étapes: [${partsExp.join(' | ')}] -> Total: ${c.ansStr}`;
            }
            else if (c.format === 'trous') {
                isCorrect = true;
                let partsAns = [], partsExp = [];
                let inputs = document.querySelectorAll(`#workspace-${id} input[data-expected]`);
                inputs.forEach(inp => { 
                    partsAns.push(inp.value.trim() || "?");
                    partsExp.push(inp.dataset.expected);
                    if(inp.value.trim() !== inp.dataset.expected) isCorrect = false; 
                });
                
                displayAns = `Cases remplies: [${partsAns.join(', ')}]`;
                displayTrue = `Attendu: [${partsExp.join(', ')}]`;
            } 
            else if(c.op === '/') {
                let uQ = parseFloat((document.getElementById(`quo-${id}`).value||'').replace(',','.'));
                let uR = parseFloat((document.getElementById(`rem-${id}`).value||'').replace(',','.'));
                uQ = isNaN(uQ) ? 0 : uQ; uR = isNaN(uR) ? 0 : uR;
                
                if(c.type === 'decimaux') { 
                    displayAns = `Q:${uQ}`; displayTrue = `Q:${c.ans}`;
                    if(uQ === c.ans) isCorrect = true;
                } else {
                    displayAns = `Q:${uQ} R:${uR}`; displayTrue = `Q:${c.ans} R:${c.rem}`;
                    if(uQ === c.ans && uR === c.rem) isCorrect = true;
                }
            } else {
                let cells = document.querySelectorAll(`.pose-inp-${id}`);
                let str = Array.from(cells).map(cell => cell.value === '' ? '0' : cell.value).join('');
                let uAns = parseFloat(str.replace(',','.')); uAns = isNaN(uAns) ? 0 : uAns;
                displayAns = uAns.toString(); displayTrue = c.ans.toString();
                if(uAns === c.ans) isCorrect = true;
            }

            let badge = document.getElementById(`correction-badge-${id}`);
            let iaDiv = document.getElementById(`ia-feedback-${id}`);
            renderWorkspace(id, true); // Injecter correction

            if(isCorrect) {
                badge.className = "px-6 py-1 rounded-full font-black text-sm md:text-base shadow bg-emerald-500 text-white";
                badge.innerHTML = `<i class="fa-solid fa-check mr-2"></i>BRAVO`;
                iaDiv.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-emerald-700 text-center"><i class="fa-solid fa-medal text-3xl mb-2"></i><p>Parfait ! Tu as validé toutes les étapes.</p></div>`;
            } else {
                badge.className = "px-6 py-1 rounded-full font-black text-sm md:text-base shadow bg-red-500 text-white";
                badge.innerHTML = `<i class="fa-solid fa-xmark mr-2"></i>ERREUR`;
                iaDiv.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-blue-600 text-center"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><p class="text-sm">J'analyse ton calcul...</p></div>`;
                fetchAIFeedback(id, c, displayAns, displayTrue);
            }
            document.getElementById(`card-container-${id}`).classList.add('flipped');
        }

        async function fetchAIFeedback(id, c, userAns, trueAns) {
            let formatText = c.format === 'arbre' ? "sous forme d'arbre de décomposition (étapes par puissance de 10 puis total)" : (c.format === 'trous' ? "sous forme de calcul à trous" : (c.op==='/' ? "en division posée" : "en calcul posé classique"));
            let prompt = `Tuteur de maths bienveillant (primaire/collège). L'élève a fait : ${c.n1} ${c.op} ${c.n2} ${formatText}.
Il a répondu : "${userAns}" au lieu de : "${trueAns}".
Explique-lui en 2 phrases très courtes et encourageantes son erreur (ex: décomposition d'un rang, addition finale, retenue, reste).
Commence directement par "Tu as...".`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.7, maxOutputTokens: 150 } })
                });
                if(!res.ok) throw new Error("API Error");
                let text = (await res.json()).candidates[0].content.parts[0].text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-blue-900">$1</strong>');
                document.getElementById(`ia-feedback-${id}`).innerHTML = `<div class="text-slate-700 text-sm"><p>${text}</p></div>`;
            } catch (error) {
                document.getElementById(`ia-feedback-${id}`).innerHTML = `<div class="text-red-500 text-center flex flex-col justify-center items-center h-full"><i class="fa-solid fa-triangle-exclamation text-lg mb-1"></i><p class="text-xs">Observe bien la correction visuelle au-dessus pour comprendre ton erreur !</p></div>`;
            }
        }

        function retourner(id) {
            document.getElementById(`card-container-${id}`).classList.remove('flipped');
            setTimeout(() => {
                if(globalState.mode !== 'libre') genererUnProbleme(id); else vider(id);
            }, 600);
        }
    </script>
</body>
</html>
