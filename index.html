<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculs Posés & Décompositions - Classe Adaptative</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #cbd5e1; overflow-x: hidden; }
        
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"], input[type="text"] { -moz-appearance: textfield; }

        /* Animation Flip 3D */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .front, .back { 
            backface-visibility: hidden; 
            -webkit-backface-visibility: hidden; 
            background-color: white; 
        }
        .back { z-index: 10; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flipper { transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .flipped .flipper { transform: rotateY(180deg); }

        /* Cellules mathématiques */
        .grid-math { display: grid; gap: 0.2rem; justify-items: center; align-items: center; font-family: 'Courier New', Courier, monospace; margin: 0 auto; }
        .cell-input { width: 2.2rem; height: 2.5rem; text-align: center; font-weight: 800; border: 2px solid #cbd5e1; border-radius: 0.4rem; background: white; color: #1e293b; transition: all 0.2s;}
        .cell-input:focus { border-color: #960018; outline: none; box-shadow: 0 0 0 3px rgba(150, 0, 24, 0.2); }
        .cell-static { width: 2.2rem; text-align: center; font-weight: 800; color: #1e293b;}
        .cell-carry { width: 1.8rem; height: 1.8rem; border-radius: 50%; border: 2px solid #e2e8f0; font-size: 0.9rem; font-weight: 700; text-align: center; background: #f8fafc; color: #ef4444;}
        .cell-carry:focus { border-color: #ef4444; outline: none; }

        /* Arbre de calcul */
        .tree-node-input { width: 4.5rem; height: 2rem; text-align: center; font-weight: bold; font-size: 0.9rem; border: 2px solid #94a3b8; border-radius: 0.5rem; background: white; color: #1e293b; }
        .tree-node-input:focus { border-color: #3b82f6; outline: none; }
        .tree-node-static { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 0.2rem 0.5rem; border-radius: 0.5rem; font-weight: bold; font-size: 0.8rem; color: #475569; white-space: nowrap; }
        .tree-node-correct { background: #d1fae5; border: 2px solid #10b981; color: #065f46; font-weight: 900; }
        .tree-node-error { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .tree-vert-line { width: 2px; background-color: #94a3b8; margin: 2px auto;}
        .tree-horiz-line { height: 3px; background-color: #94a3b8; position: absolute; z-index: 1; border-radius: 2px; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }

        /* Grille Responsive */
        #cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1rem;
            padding: 10px;
        }

        @media (max-width: 640px) {
            .perspective-1000 { width: 95vw !important; margin: 10px auto; }
            h1 { font-size: 1.5rem !important; }
            .controls-bar { flex-direction: column !important; align-items: stretch !important; gap: 10px !important; }
            .controls-bar > div { justify-content: center; width: 100%; flex-wrap: wrap; }
            #players-selector { justify-content: center; }
        }
    </style>
</head>
<body class="h-screen flex flex-col text-slate-800">

    <!-- HEADER GLOBAL -->
    <header class="bg-[#960018] text-white flex flex-col md:flex-row justify-between items-center px-6 py-4 shadow-md z-20 shrink-0 gap-4">
        <div class="flex items-center gap-4 w-full md:w-auto justify-center md:justify-start">
            <div class="bg-white/20 p-2 rounded-xl hidden md:block"><i class="fa-solid fa-calculator text-2xl w-8 h-8 flex justify-center items-center"></i></div>
            <div class="text-center md:text-left">
                <h1 class="text-2xl font-black uppercase tracking-wide">Calculs posés & Décompositions</h1>
                <p class="text-sm font-semibold tracking-widest text-white/80 uppercase">Classe Adaptative</p>
            </div>
        </div>
        <div class="flex flex-wrap justify-center bg-white/10 rounded-full p-1 border border-white/20 font-bold text-sm" id="players-selector">
            <button data-players="1" class="player-btn px-4 md:px-6 py-2 rounded-full bg-white text-[#960018] shadow transition">INDIVIDUEL</button>
            <button data-players="2" class="player-btn px-4 md:px-6 py-2 rounded-full hover:bg-white/20 text-white transition">DUEL</button>
            <button data-players="3" class="player-btn px-4 md:px-6 py-2 rounded-full hover:bg-white/20 text-white transition hidden md:block">TRIPLE</button>
            <button data-players="4" class="player-btn px-4 md:px-6 py-2 rounded-full hover:bg-white/20 text-white transition">ÉQUIPE</button>
        </div>
    </header>

    <!-- BARRE DE MODE & TIMER -->
    <div class="bg-white shadow-sm border-b border-slate-200 px-4 md:px-8 py-3 flex flex-wrap justify-between items-center gap-4 z-10 shrink-0 controls-bar">
        <div class="flex flex-wrap space-x-1 font-bold text-sm bg-slate-100 p-1 rounded-xl w-full md:w-auto justify-center" id="mode-selector">
            <button data-mode="entrainement" class="mode-btn px-4 md:px-6 py-2 rounded-lg bg-slate-800 text-white shadow">ENTRAÎNEMENT</button>
            <button data-mode="libre" class="mode-btn px-4 md:px-6 py-2 rounded-lg text-slate-500 hover:bg-slate-200 transition">LIBRE</button>
            <button data-mode="sprint" class="mode-btn px-4 md:px-6 py-2 rounded-lg text-slate-500 hover:bg-slate-200 transition">SPRINT</button>
        </div>
        
        <div id="global-timer" class="hidden text-[#960018] font-black text-2xl bg-red-50 px-6 py-2 rounded-xl border border-red-200 shadow-inner text-center w-full md:w-auto justify-center">
            <i class="fa-solid fa-clock mr-2 animate-pulse"></i><span>30</span>s
        </div>
    </div>

    <!-- MAIN WORKSPACE -->
    <main class="flex-1 p-2 md:p-6 flex flex-col overflow-y-auto w-full">
        <div id="cards-container"></div>
    </main>

    <script>
        let globalState = { mode: 'entrainement', playersCount: 1, timer: null, timeLeft: 30 };
        let cardsData = []; 

        document.addEventListener("DOMContentLoaded", () => {
            setupGlobalListeners();
            setPlayers(1);
        });

        function setupGlobalListeners() {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.mode-btn').forEach(b => { b.classList.remove('bg-slate-800', 'text-white', 'shadow'); b.classList.add('text-slate-500'); });
                    e.target.classList.remove('text-slate-500'); e.target.classList.add('bg-slate-800', 'text-white', 'shadow');
                    globalState.mode = e.target.dataset.mode;
                    
                    document.getElementById('global-timer').classList.toggle('hidden', globalState.mode !== 'sprint');
                    if(globalState.mode === 'sprint') { startTimer(); initAllGames(); } 
                    else { stopTimer(); initAllGames(); }
                });
            });

            document.querySelectorAll('.player-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.player-btn').forEach(b => { b.classList.remove('bg-white', 'text-[#960018]', 'shadow'); b.classList.add('text-white'); });
                    e.target.classList.remove('text-white'); e.target.classList.add('bg-white', 'text-[#960018]', 'shadow');
                    setPlayers(parseInt(e.target.dataset.players));
                });
            });
        }

        function startTimer() {
            stopTimer(); globalState.timeLeft = 30; updateTimerUI();
            globalState.timer = setInterval(() => {
                globalState.timeLeft--; updateTimerUI();
                if(globalState.timeLeft <= 0) { stopTimer(); for(let i=0; i<globalState.playersCount; i++) corriger(i); }
            }, 1000);
        }
        function stopTimer() { clearInterval(globalState.timer); }
        function updateTimerUI() {
            const span = document.querySelector('#global-timer span');
            if(span) span.innerText = globalState.timeLeft;
            const container = document.getElementById('global-timer');
            if(globalState.timeLeft <= 10) container.classList.replace('text-[#960018]', 'text-red-600');
            else container.classList.replace('text-red-600', 'text-[#960018]');
        }

        function setPlayers(count) {
            globalState.playersCount = count;
            const container = document.getElementById('cards-container');
            
            let gridClasses = {
                1: 'grid-cols-1 max-w-4xl mx-auto',
                2: 'grid-cols-1 lg:grid-cols-2 max-w-[98%] mx-auto',
                3: 'grid-cols-1 lg:grid-cols-3 max-w-[98%] mx-auto',
                4: 'grid-cols-1 lg:grid-cols-4 max-w-full px-2'
            };
            container.className = `grid gap-4 w-full min-h-0 ${gridClasses[count]}`;

            let newCardsData = [];
            for(let i=0; i<count; i++) {
                newCardsData.push(cardsData[i] || { n1: 0, n2: 0, ans: 0, rem: 0, op: '+', limit: 1000, type: 'entiers', format: 'pose', rank: 1 });
            }
            cardsData = newCardsData;

            container.innerHTML = '';
            for(let i=0; i<count; i++) container.innerHTML += createCardHTML(i);
            initAllGames();
        }

        function createCardHTML(id) {
            let c = cardsData[id];
            let opSymbol = c.op === '*' ? 'x' : (c.op === '/' ? '÷' : c.op);
            
            // Paramètres Indépendants
            let settingsHtml = `
                <div class="bg-slate-100 rounded-xl mb-3 flex flex-row justify-between items-center gap-1 md:gap-2 shrink-0 border border-slate-200 shadow-sm h-auto md:h-12 p-2 flex-wrap">
                    <select onchange="updateCardSettings(${id}, 'op', this.value)" class="bg-white border-2 border-[#960018] text-[#960018] rounded-lg h-8 px-1 md:px-2 font-black outline-none text-sm text-center shadow-sm cursor-pointer w-12">
                        <option value="+" ${c.op==='+'?'selected':''}>+</option>
                        <option value="-" ${c.op==='-'?'selected':''}>-</option>
                        <option value="*" ${c.op==='*'?'selected':''}>x</option>
                        <option value="/" ${c.op==='/'?'selected':''}>÷</option>
                    </select>
                    <select onchange="updateCardSettings(${id}, 'rank', this.value)" id="rank-select-${id}" class="bg-white border border-slate-300 rounded-lg h-8 px-1 font-bold text-slate-700 outline-none text-[11px] md:text-xs flex-1 cursor-pointer min-w-[60px]" style="display: ${c.op === '*' || c.op === '/' ? 'inline-block' : 'none'};">
                        <option value="1" ${c.rank==1?'selected':''}>1 rang</option>
                        <option value="2" ${c.rank==2?'selected':''}>2 rangs</option>
                        <option value="3" ${c.rank==3?'selected':''}>3 rangs</option>
                        <option value="4" ${c.rank==4?'selected':''}>4 rangs</option>
                    </select>
                    <select onchange="updateCardSettings(${id}, 'format', this.value)" id="format-select-${id}" class="bg-white border border-slate-300 rounded-lg h-8 px-1 font-bold text-slate-700 outline-none text-[11px] md:text-xs flex-1 cursor-pointer min-w-[60px]">
                        <option value="pose" ${c.format==='pose'?'selected':''}>Posé</option>
                        <option value="arbre" ${c.format==='arbre'?'selected':''} ${c.op==='/'?'disabled':''}>Arbre</option>
                        <option value="trous" ${c.format==='trous'?'selected':''} ${c.op==='/'?'disabled':''}>À trous</option>
                    </select>
                    <select onchange="updateCardSettings(${id}, 'type', this.value)" class="bg-blue-50 border border-blue-200 text-blue-800 rounded-lg h-8 px-1 font-bold outline-none text-[11px] md:text-xs flex-1 cursor-pointer min-w-[60px]">
                        <option value="entiers" ${c.type==='entiers'?'selected':''}>Entiers</option>
                        <option value="decimaux" ${c.type==='decimaux'?'selected':''}>Décimaux</option>
                    </select>
                    <select onchange="updateCardSettings(${id}, 'limit', this.value)" class="bg-white border border-slate-300 rounded-lg h-8 px-1 font-bold text-slate-500 outline-none text-[10px] md:text-xs flex-1 cursor-pointer min-w-[60px]">
                        <option value="10" ${c.limit==10?'selected':''}>&lt; 10</option>
                        <option value="100" ${c.limit==100?'selected':''}>&lt; 100</option>
                        <option value="1000" ${c.limit==1000?'selected':''}>&lt; 1 000</option>
                        <option value="10000" ${c.limit==10000?'selected':''}>&lt; 10 000</option>
                        <option value="100000" ${c.limit==100000?'selected':''}>&lt; 100 000</option>
                        <option value="1000000" ${c.limit==1000000?'selected':''}>&lt; 1 000 000</option>
                    </select>
                    <button onclick="genererUnProbleme(${id})" class="bg-slate-800 text-white h-8 px-2 rounded-lg font-bold shadow hover:bg-slate-700 transition" title="Nouveau calcul"><i class="fa-solid fa-rotate-right"></i></button>
                </div>`;

            let libreHtml = `
                <div id="libre-inputs-${id}" class="${globalState.mode === 'libre' ? 'flex' : 'hidden'} justify-center items-center gap-2 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-200 flex-wrap">
                    <input type="number" step="any" id="libre-n1-${id}" placeholder="Num 1" class="w-full md:w-2/5 border-2 border-slate-300 rounded-lg p-2 text-center font-bold focus:border-[#960018] outline-none text-sm mb-2 md:mb-0">
                    <span class="text-lg font-black" id="libre-op-symbol-${id}">${opSymbol}</span>
                    <input type="number" step="any" id="libre-n2-${id}" placeholder="Num 2" class="w-full md:w-2/5 border-2 border-slate-300 rounded-lg p-2 text-center font-bold focus:border-[#960018] outline-none text-sm mt-2 md:mt-0">
                    <button onclick="genererGrilleLibre(${id})" class="bg-[#960018] text-white px-3 py-2 rounded-lg font-bold shadow hover:bg-red-800 transition w-full md:w-auto mt-2 md:mt-0"><i class="fa-solid fa-play"></i> Poser</button>
                </div>`;

            return `
            <div class="perspective-1000 relative w-full flex-1 flex flex-col min-h-[600px] h-full" id="card-container-${id}">
                <div class="flipper w-full h-full absolute transform-style-3d">
                    
                    <div class="front absolute w-full h-full bg-white rounded-3xl shadow-xl flex flex-col p-3 md:p-4 border-2 border-slate-100 overflow-hidden">
                        ${settingsHtml}
                        
                        <div style="container-type: inline-size;" class="bg-[#0f172a] rounded-xl text-white mb-3 shadow-inner h-16 md:h-20 flex items-center justify-center shrink-0 w-full ${globalState.mode === 'libre' ? 'hidden' : ''}" id="banner-${id}">
                            <h2 style="font-size: clamp(1.2rem, 9cqi, 3rem);" class="font-black tracking-widest text-center px-2 w-full whitespace-nowrap" id="op-display-${id}">---</h2>
                        </div>
                        
                        ${libreHtml}

                        <div id="workspace-${id}" class="flex-1 bg-slate-50 rounded-2xl border-2 border-slate-200 flex flex-col items-center justify-center p-2 overflow-x-auto overflow-y-auto custom-scrollbar relative w-full"></div>

                        <div class="flex gap-2 mt-3 shrink-0 w-full">
                            <button onclick="corriger(${id})" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white text-lg font-black py-3 rounded-xl shadow transition transform hover:-translate-y-1">VÉRIFIER</button>
                            <button onclick="vider(${id})" class="w-16 md:w-20 bg-white border-2 border-slate-200 text-red-500 hover:bg-red-50 text-base font-bold py-3 rounded-xl shadow transition"><i class="fa-solid fa-eraser"></i></button>
                        </div>
                    </div>

                    <div class="back absolute w-full h-full bg-white rounded-3xl shadow-xl flex flex-col p-3 md:p-4 border-2 border-slate-100 rotate-y-180 overflow-hidden">
                        
                        <div class="flex justify-between items-center mb-4 shrink-0 px-2">
                            <h3 class="font-black text-xl text-slate-800 uppercase tracking-widest">Correction</h3>
                            <div id="correction-badge-${id}" class="px-4 py-1 rounded-full font-black text-sm md:text-base shadow text-white"></div>
                        </div>

                        <div class="flex-1 bg-emerald-50 border-2 border-emerald-100 rounded-xl flex flex-col items-center justify-center overflow-auto relative p-4 w-full">
                            <div id="correct-grid-${id}" class="w-full h-full flex flex-col items-center justify-center origin-top p-2" style="transform: scale(0.95); transform-origin: top center;"></div>
                        </div>

                        <button onclick="retourner(${id})" class="mt-4 shrink-0 w-full bg-slate-900 hover:bg-slate-800 text-white text-xl font-black py-4 rounded-xl shadow transition flex items-center justify-center gap-2">
                            CONTINUER <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>`;
        }

        function updateCardSettings(id, key, value) {
            let c = cardsData[id];
            if(key === 'limit' || key === 'rank') value = parseInt(value);
            c[key] = value;
            
            if(key === 'op') {
                let formatSelect = document.getElementById(`format-select-${id}`);
                let rankSelect = document.getElementById(`rank-select-${id}`);
                
                if (value === '*' || value === '/') {
                    rankSelect.style.display = 'inline-block';
                } else {
                    rankSelect.style.display = 'none';
                }

                if (value === '/') {
                    formatSelect.value = 'pose'; c.format = 'pose'; formatSelect.disabled = true;
                } else {
                    formatSelect.disabled = false;
                    let optArbre = formatSelect.querySelector('option[value="arbre"]');
                    let optTrous = formatSelect.querySelector('option[value="trous"]');
                    if(optArbre) optArbre.disabled = false;
                    if(optTrous) optTrous.disabled = false;
                }
                let sym = value === '*' ? 'x' : (value === '/' ? '÷' : value);
                let opSpan = document.getElementById(`libre-op-symbol-${id}`);
                if(opSpan) opSpan.innerText = sym;
            }
            if(globalState.mode !== 'libre') genererUnProbleme(id);
        }

        function initAllGames() {
            for(let i=0; i<globalState.playersCount; i++) {
                if(globalState.mode === 'libre') {
                    document.getElementById(`workspace-${i}`).innerHTML = '<div class="text-slate-400 font-bold text-center h-full flex flex-col items-center justify-center"><i class="fa-solid fa-pen-nib text-5xl mb-4 opacity-50"></i><span>Saisissez vos nombres</span></div>';
                    document.getElementById(`banner-${i}`).classList.add('hidden');
                    document.getElementById(`libre-inputs-${i}`).classList.remove('hidden');
                    document.getElementById(`libre-inputs-${i}`).classList.add('flex');
                } else {
                    document.getElementById(`banner-${i}`).classList.remove('hidden');
                    document.getElementById(`libre-inputs-${i}`).classList.add('hidden');
                    document.getElementById(`libre-inputs-${i}`).classList.remove('flex');
                    genererUnProbleme(i);
                }
            }
        }

        function getRandom(min, max, isDec) {
            let n = Math.random() * (max - min) + min; return isDec ? parseFloat(n.toFixed(2)) : Math.floor(n);
        }

        function genererUnProbleme(id) {
            if(globalState.mode === 'libre') { vider(id); return; }
            let c = cardsData[id]; let isDec = c.type === 'decimaux';
            
            if (c.op === '+') { 
                c.n1 = getRandom(c.limit === 10 ? 1 : (c.limit === 100 ? 10 : c.limit/10), c.limit, isDec); 
                c.n2 = getRandom(c.limit === 10 ? 1 : (c.limit === 100 ? 1 : c.limit/100), c.limit, isDec); 
            } 
            else if (c.op === '-') { 
                c.n1 = getRandom(c.limit === 10 ? 2 : (c.limit === 100 ? 10 : c.limit/10), c.limit, isDec); 
                c.n2 = getRandom(1, c.n1, isDec); 
            } 
            else if (c.op === '*') { 
                c.n1 = getRandom(2, c.limit === 10 ? 9 : (c.limit === 100 ? 50 : c.limit/10), isDec); 
                
                let minR = 2, maxR = 9;
                if(c.rank == 2) { minR = 10; maxR = 99; }
                else if(c.rank == 3) { minR = 100; maxR = 999; }
                else if(c.rank == 4) { minR = 1000; maxR = 9999; }
                
                if(c.format === 'arbre') { minR = 2; maxR = 9; } 
                
                c.n2 = getRandom(minR, maxR, false); 
            } 
            else if (c.op === '/') {
                let minR = 2, maxR = 9;
                if(c.rank == 2) { minR = 10; maxR = 99; }
                else if(c.rank == 3) { minR = 100; maxR = 999; }
                else if(c.rank == 4) { minR = 1000; maxR = 9999; }
                
                c.n2 = getRandom(minR, maxR, false); 
                
                let maxQ = Math.floor(c.limit / c.n2);
                let q = getRandom(1, Math.max(1, Math.min(999, maxQ)), false);
                c.n1 = (c.n2 * q) + Math.floor(Math.random() * c.n2);
                
                if(c.n1 >= c.limit) {
                    c.n1 = c.limit - 1;
                }

                if(isDec) c.n1 = parseFloat((c.n1 + getRandom(0.1, 0.99, true)).toFixed(2));
            }

            calculerReponse(id);
            if(c.format === 'trous') genererMasquesTrous(id);
            afficherBandeau(id);
            renderWorkspace(id, false);
        }

        function genererGrilleLibre(id) {
            let v1 = document.getElementById(`libre-n1-${id}`).value; let v2 = document.getElementById(`libre-n2-${id}`).value;
            if(!v1 || !v2) return alert("Saisissez les nombres.");
            cardsData[id].n1 = parseFloat(v1.replace(',', '.')); cardsData[id].n2 = parseFloat(v2.replace(',', '.'));
            
            if(cardsData[id].op === '-' && cardsData[id].n1 < cardsData[id].n2) { alert("Le premier nombre doit être plus grand."); return; }
            calculerReponse(id); 
            if(cardsData[id].format === 'trous') genererMasquesTrous(id); 
            renderWorkspace(id, false);
        }

        function calculerReponse(id) {
            let c = cardsData[id];
            if(c.op === '+') c.ans = c.n1 + c.n2;
            if(c.op === '-') c.ans = c.n1 - c.n2;
            if(c.op === '*') c.ans = c.n1 * c.n2;
            if(c.op === '/') {
                if(c.type === 'entiers' && Number.isInteger(c.n1)) { c.ans = Math.floor(c.n1/c.n2); c.rem = c.n1%c.n2; } 
                else { c.ans = parseFloat((c.n1/c.n2).toFixed(2)); c.rem = 0; }
            }
            if(c.op !== '/') c.ans = parseFloat(c.ans.toFixed(4));
            
            c.n1Str = c.n1.toString().replace('.', ','); c.n2Str = c.n2.toString().replace('.', ','); c.ansStr = c.ans.toString().replace('.', ',');
        }

        function genererMasquesTrous(id) {
            let c = cardsData[id];
            c.mask = { n1: [], n2: [], ans: [] };
            
            let cols = getCols(c.n1Str, c.n2Str);
            let s1Idx = cols - c.n1Str.length;
            let s2Idx = cols - c.n2Str.length;
            let sAnsIdx = cols - c.ansStr.length;
            
            for(let col = 0; col < cols; col++) {
                let options = [];
                if(col >= s1Idx && c.n1Str[col - s1Idx] !== ',') options.push('n1');
                if(col >= s2Idx && c.n2Str[col - s2Idx] !== ',') options.push('n2');
                if(col >= sAnsIdx && c.ansStr[col - sAnsIdx] !== ',') options.push('ans');
                
                if(options.length > 0) {
                    if(Math.random() > 0.5) {
                        let chosen = options[Math.floor(Math.random() * options.length)];
                        if(chosen === 'n1') c.mask.n1.push(col - s1Idx);
                        else if(chosen === 'n2') c.mask.n2.push(col - s2Idx);
                        else if(chosen === 'ans') c.mask.ans.push(col - sAnsIdx);
                    }
                }
            }
        }

        function afficherBandeau(id) {
            let c = cardsData[id];
            let sym = c.op === '*' ? 'x' : (c.op === '/' ? '÷' : c.op);
            
            let dispN1 = c.n1Str;
            let dispN2 = c.n2Str;
            let dispAns = "";

            if (c.format === 'trous') {
                const applyMask = (str, mask) => str.split('').map((char, i) => mask && mask.includes(i) ? '.' : char).join('');
                dispN1 = applyMask(c.n1Str, c.mask?.n1);
                dispN2 = applyMask(c.n2Str, c.mask?.n2);
                dispAns = ` <span class="text-white/50 mx-1">=</span> ${applyMask(c.ansStr, c.mask?.ans)}`;
            }
            
            document.getElementById(`op-display-${id}`).innerHTML = `${dispN1} <span class="text-[#960018] mx-1 md:mx-2">${sym}</span> ${dispN2}${dispAns}`;
        }

        // --- MOTEUR DE RENDU ---
        
        function getPlaceValues(str) {
            let pv = {}; let [intP, decP] = str.split(',');
            if (intP) {
                let len = intP.length;
                for(let i=0; i<len; i++) {
                    let power = len - 1 - i;
                    if(intP[i] !== '0') pv[power] = intP[i] + "0".repeat(power);
                }
            }
            if (decP) {
                for(let i=0; i<decP.length; i++) {
                    let power = -(i + 1);
                    if(decP[i] !== '0') pv[power] = "0," + "0".repeat(i) + decP[i];
                }
            }
            return Object.keys(pv).map(Number).sort((a,b) => b - a).map(power => ({ val: pv[power], power: power }));
        }

        function getCols(s1, s2) {
            let p1 = s1.split(','); let p2 = s2.split(',');
            let mI = Math.max(p1[0].length, p2[0].length); let mD = Math.max((p1[1]||'').length, (p2[1]||'').length);
            return mI + mD + (mD>0?1:0) + 2; 
        }

        function dessinerGrille(id, isCorrection, errors = {}) {
            let c = cardsData[id];
            
            if (c.op === '/') {
                if(isCorrection) {
                    let stepsHTML = "";
                    if(c.type === 'entiers' && Number.isInteger(c.n1)) {
                        let cur = ""; let offset = 0; let s1Str = c.n1.toString();
                        for(let i=0; i<s1Str.length; i++) {
                            cur += s1Str[i]; let val = parseInt(cur);
                            if(val >= c.n2) {
                                let sub = Math.floor(val/c.n2) * c.n2; let rem = val - sub;
                                stepsHTML += `<div class="text-red-500 font-mono text-sm mt-1 tracking-widest leading-tight">${"&nbsp;".repeat(offset)}- ${sub}</div><div class="border-t-2 border-slate-400 w-12 ml-auto mb-1"></div>`;
                                cur = rem === 0 ? "" : rem.toString();
                            }
                            offset++;
                        }
                    }
                    
                    let qClass = "pt-2 font-black text-lg md:text-xl tracking-widest w-full px-2 py-1 rounded " + (errors.quo ? "bg-red-100 text-red-800 border border-red-500" : "bg-blue-100 text-blue-800");
                    let rClass = "font-bold mt-2 inline-block px-2 rounded text-xs md:text-sm " + (errors.rem ? "bg-red-100 text-red-800 border border-red-500" : "bg-emerald-100 text-emerald-700 border border-emerald-300");

                    return `
                        <div class="flex w-full max-w-[280px] mx-auto items-start font-mono">
                            <div class="flex-1 pr-2 md:pr-3 border-r-4 border-slate-800 text-right">
                                <div class="tracking-[0.2em] font-black text-xl md:text-2xl text-slate-800">${c.n1Str}</div>${stepsHTML}
                                <div class="${rClass}">R: ${c.rem}</div>
                            </div>
                            <div class="flex-1 pl-2 md:pl-3 flex flex-col items-start">
                                <div class="border-b-4 border-slate-800 pb-1 w-full font-black text-xl md:text-2xl tracking-[0.2em] text-slate-800">${c.n2Str}</div>
                                <div class="${qClass}">${c.ansStr}</div>
                            </div>
                        </div>`;
                } else {
                    return `
                        <div class="flex w-full font-mono max-w-[320px] mx-auto min-h-[180px]">
                            <div class="flex-1 pr-2 md:pr-3 flex flex-col items-end border-r-4 border-slate-300 relative">
                                <div class="tracking-[0.3em] font-black text-xl md:text-2xl mb-2 text-slate-800">${c.n1Str}</div>
                                <textarea class="w-full flex-1 bg-white border-2 border-slate-200 rounded-lg resize-none outline-none text-right text-sm md:text-base text-slate-600 custom-scrollbar p-2" placeholder="Sous-tractions..."></textarea>
                                <div class="mt-2 flex items-center gap-1 md:gap-2">
                                    <span class="font-bold text-red-600 uppercase text-[10px] md:text-xs">Reste</span>
                                    <input type="number" step="any" id="rem-${id}" class="cell-input w-16 md:w-20 border-red-300 text-red-700 focus:border-red-600" style="height:2rem;font-size:1.1rem;">
                                </div>
                            </div>
                            <div class="flex-1 pl-2 md:pl-3 flex flex-col relative">
                                <div class="border-b-4 border-slate-800 pb-1 font-black text-xl md:text-2xl tracking-[0.3em] text-slate-800">${c.n2Str}</div>
                                <div class="pt-3">
                                    <input type="number" step="any" id="quo-${id}" class="cell-input w-full bg-blue-50 border-blue-300 text-blue-800 tracking-widest focus:border-blue-600 font-black" placeholder="Quotient" style="height:2.5rem;font-size:1.2rem;">
                                </div>
                            </div>
                        </div>`;
                }
            }

            let cellW = globalState.playersCount >= 3 && !isCorrection ? '1.5rem' : '2.2rem';
            let cellF = 'clamp(12px, 2.5vw, 22px)';
            let cols = getCols(c.n1Str, c.n2Str);
            let html = `<div class="grid-math" style="grid-template-columns: repeat(${cols}, ${cellW}); gap:0.1rem;">`;

            if (c.op === '+' || c.op === '-') {
                for(let i=0; i<cols; i++) html += isCorrection ? `<div></div>` : `<input type="text" maxlength="1" class="cell-carry shadow-sm" style="width:1.2rem;height:1.2rem;font-size:0.7rem;">`;
                
                let s1Idx = cols - c.n1Str.length;
                for(let i=0; i<cols; i++) {
                    if (i >= s1Idx) {
                        let cIdx = i - s1Idx; let char = c.n1Str[cIdx];
                        if (isCorrection && c.format === 'trous' && c.mask.n1.includes(cIdx)) {
                            let cl = errors[`n1_${cIdx}`] ? "border-red-500 bg-red-100 text-red-900" : "border-emerald-500 bg-emerald-100 text-emerald-900";
                            html += `<div class="cell-input shadow flex items-center justify-center font-black p-0 ${cl}" style="width:${cellW};height:2rem;font-size:${cellF}">${char}</div>`;
                        }
                        else if(c.format==='trous' && c.mask.n1.includes(cIdx) && !isCorrection) html += `<input type="text" maxlength="1" class="cell-input trou-inp-${id} border-orange-400 bg-orange-50 p-0" data-expected="${char}" data-pos="n1_${cIdx}" style="width:${cellW};font-size:${cellF}; height:2rem;">`;
                        else html += `<div class="cell-static ${char===','?'text-red-500':''}" style="width:${cellW};font-size:${cellF}">${char}</div>`;
                    } else html += `<div></div>`;
                }
                
                let s2Idx = cols - c.n2Str.length;
                for(let i=0; i<cols; i++) {
                    let border = "border-b-4 border-slate-800 pb-1 mb-1 w-full flex justify-center";
                    if(i === 0) html += `<div class="cell-static text-[#960018] ${border}" style="width:${cellW};font-size:${cellF}">${c.op}</div>`;
                    else if (i >= s2Idx) {
                        let cIdx = i - s2Idx; let char = c.n2Str[cIdx];
                        if (isCorrection && c.format === 'trous' && c.mask.n2.includes(cIdx)) {
                            let cl = errors[`n2_${cIdx}`] ? "border-red-500 bg-red-100 text-red-900" : "border-emerald-500 bg-emerald-100 text-emerald-900";
                            html += `<div class="${border}"><div class="cell-input shadow flex items-center justify-center font-black p-0 ${cl}" style="width:${cellW};height:2rem;font-size:${cellF}">${char}</div></div>`;
                        }
                        else if(c.format==='trous' && c.mask.n2.includes(cIdx) && !isCorrection) html += `<div class="${border}"><input type="text" maxlength="1" class="cell-input trou-inp-${id} border-orange-400 bg-orange-50 p-0" data-expected="${char}" data-pos="n2_${cIdx}" style="width:${cellW};font-size:${cellF};height:2rem"></div>`;
                        else html += `<div class="cell-static ${char===','?'text-red-500':''} ${border}" style="width:${cellW};font-size:${cellF}">${char}</div>`;
                    } else html += `<div class="${border}"></div>`;
                }

                let sAnsIdx = cols - c.ansStr.length;
                for(let i=0; i<cols; i++) {
                    if (i >= sAnsIdx) {
                        let cIdx = i - sAnsIdx; let char = c.ansStr[cIdx];
                        if (isCorrection) {
                            let isErr = false;
                            if(c.format === 'trous' && c.mask.ans.includes(cIdx)) isErr = errors[`ans_${cIdx}`];
                            else if (c.format === 'pose') isErr = errors[`ans_${cIdx}`];
                            
                            let cl = isErr ? "border-red-500 bg-red-100 text-red-900" : "border-emerald-500 bg-emerald-100 text-emerald-900";
                            html += `<div class="cell-input shadow flex items-center justify-center font-black p-0 ${cl}" style="width:${cellW};height:2rem;font-size:${cellF}">${char}</div>`;
                        }
                        else if (c.format === 'trous') {
                            if (c.mask.ans.includes(cIdx)) html += `<input type="text" maxlength="1" class="cell-input trou-inp-${id} border-orange-400 bg-orange-50 p-0" data-expected="${char}" data-pos="ans_${cIdx}" style="width:${cellW};height:2rem;font-size:${cellF}">`;
                            else html += `<div class="cell-static text-blue-800" style="width:${cellW};font-size:${cellF}">${char}</div>`;
                        }
                        else html += `<input type="text" maxlength="1" class="cell-input pose-inp-${id} focus:border-[#960018] p-0" data-pos="ans_${cIdx}" style="width:${cellW};height:2rem;font-size:${cellF}">`;
                    } else html += `<div></div>`;
                }
            } 
            else if (c.op === '*') {
                cols = Math.max(c.n1Str.length, c.n2Str.length) + 4;
                html = `<div class="grid-math" style="grid-template-columns: repeat(${cols}, ${cellW}); gap:0.1rem;">`;
                for(let i=0; i<cols; i++) html += isCorrection ? `<div></div>` : `<input type="text" maxlength="1" class="cell-carry mb-1" style="width:1.2rem;height:1.2rem;font-size:0.7rem;">`;
                
                let s1Idx = cols - c.n1Str.length;
                for(let i=0; i<cols; i++) {
                    if (i>=s1Idx) {
                        let cIdx = i-s1Idx; let char=c.n1Str[cIdx];
                        if (isCorrection && c.format === 'trous' && c.mask.n1.includes(cIdx)) {
                            let cl = errors[`n1_${cIdx}`] ? "border-red-500 bg-red-100 text-red-900" : "border-emerald-500 bg-emerald-100 text-emerald-900";
                            html += `<div class="cell-input shadow flex items-center justify-center font-black p-0 ${cl}" style="width:${cellW};height:2rem;font-size:${cellF}">${char}</div>`;
                        }
                        else if(c.format==='trous' && c.mask.n1.includes(cIdx) && !isCorrection) html += `<input type="text" maxlength="1" class="cell-input trou-inp-${id} border-orange-400 bg-orange-50 p-0" data-expected="${char}" data-pos="n1_${cIdx}" style="width:${cellW};font-size:${cellF};height:2rem">`;
                        else html += `<div class="cell-static ${char===','?'text-red-500':''}" style="width:${cellW};font-size:${cellF}">${char}</div>`;
                    } else html += `<div></div>`;
                }

                let s2Idx = cols - c.n2Str.length;
                for(let i=0; i<cols; i++) {
                    let border = "border-b-4 border-slate-800 pb-1 mb-1 w-full flex justify-center";
                    if(i===0) html += `<div class="cell-static text-[#960018] ${border}" style="width:${cellW};font-size:${cellF}">x</div>`;
                    else if(i>=s2Idx) {
                        let cIdx = i-s2Idx; let char=c.n2Str[cIdx];
                        if (isCorrection && c.format === 'trous' && c.mask.n2.includes(cIdx)) {
                            let cl = errors[`n2_${cIdx}`] ? "border-red-500 bg-red-100 text-red-900" : "border-emerald-500 bg-emerald-100 text-emerald-900";
                            html += `<div class="${border}"><div class="cell-input shadow flex items-center justify-center font-black p-0 ${cl}" style="width:${cellW};height:2rem;font-size:${cellF}">${char}</div></div>`;
                        }
                        else if(c.format==='trous' && c.mask.n2.includes(cIdx) && !isCorrection) html += `<div class="${border}"><input type="text" maxlength="1" class="cell-input trou-inp-${id} border-orange-400 bg-orange-50 p-0" data-expected="${char}" data-pos="n2_${cIdx}" style="width:${cellW};font-size:${cellF};height:2rem"></div>`;
                        else html += `<div class="cell-static ${char===','?'text-red-500':''} ${border}" style="width:${cellW};font-size:${cellF}">${char}</div>`;
                    } else html += `<div class="${border}"></div>`;
                }

                let s2Clean = c.n2Str.replace(',','');
                if(s2Clean.length > 1) {
                    for(let i=0; i<s2Clean.length; i++) {
                        let digit = parseInt(s2Clean[s2Clean.length - 1 - i]);
                        let prodStr = (parseInt(c.n1Str.replace(',','')) * digit).toString().padStart(cols - i, ' ');
                        for(let col=0; col<cols; col++) {
                            if(col < cols - i) {
                                let val = prodStr[col];
                                if (isCorrection) {
                                    let cl = errors[`prod_${i}_${col}`] ? "border-red-500 bg-red-100 text-red-900" : "text-blue-700";
                                    html += `<div class="cell-static ${cl}" style="width:${cellW};font-size:${cellF}">${val?.trim()?val:''}</div>`;
                                }
                                else if(c.format==='trous') html += `<div class="cell-static text-blue-700" style="width:${cellW};font-size:${cellF}">${val?.trim()?val:''}</div>`;
                                else html += `<input type="text" maxlength="1" class="cell-input border-slate-200 bg-white p-0 prod-inp-${id}" data-expected="${val?.trim()?val:''}" data-pos="prod_${i}_${col}" style="width:${cellW};height:1.8rem;font-size:${cellF}">`;
                            } else html += `<div class="cell-static text-slate-300 font-black" style="width:${cellW};font-size:${cellF}">0</div>`;
                        }
                    }
                    for(let i=0; i<cols; i++) {
                        let border = "border-t-4 border-slate-800 pt-1 mt-1 w-full flex justify-center";
                        html += i===0 ? `<div class="cell-static text-[#960018] ${border}" style="width:${cellW};font-size:${cellF}">+</div>` : `<div class="${border}"></div>`;
                    }
                }

                let sAnsIdx = cols - c.ansStr.length;
                for(let i=0; i<cols; i++) {
                    if (i >= sAnsIdx) {
                        let cIdx = i - sAnsIdx; let char = c.ansStr[cIdx];
                        if (isCorrection) {
                            let isErr = false;
                            if(c.format === 'trous' && c.mask.ans.includes(cIdx)) isErr = errors[`ans_${cIdx}`];
                            else if (c.format === 'pose') isErr = errors[`ans_${cIdx}`];
                            
                            let cl = isErr ? "border-red-500 bg-red-100 text-red-900" : "border-emerald-500 bg-emerald-100 text-emerald-900";
                            html += `<div class="cell-input shadow flex items-center justify-center font-black p-0 ${cl}" style="width:${cellW};height:2rem;font-size:${cellF}">${char}</div>`;
                        }
                        else if (c.format === 'trous') {
                            if (c.mask.ans.includes(cIdx)) html += `<input type="text" maxlength="1" class="cell-input trou-inp-${id} border-orange-400 bg-orange-50 p-0" data-expected="${char}" data-pos="ans_${cIdx}" style="width:${cellW};height:2rem;font-size:${cellF}">`;
                            else html += `<div class="cell-static text-blue-800" style="width:${cellW};font-size:${cellF}">${char}</div>`;
                        }
                        else html += `<input type="text" maxlength="1" class="cell-input pose-inp-${id} focus:border-[#960018] p-0" data-pos="ans_${cIdx}" style="width:${cellW};height:2rem;font-size:${cellF}">`;
                    } else html += `<div></div>`;
                }
            }
            html += `</div>`; return html;
        }

        function renderWorkspace(id, isCorrection, errors = {}) {
            let c = cardsData[id];
            const ws = document.getElementById(isCorrection ? `correct-grid-${id}` : `workspace-${id}`);
            
            if (c.format === 'arbre') {
                if (c.op === '/') {
                    ws.innerHTML = `<div class="text-[#960018] font-black text-xl md:text-2xl py-8 text-center flex items-center justify-center h-full w-full">Mode arbre indisponible</div>`;
                    return;
                }

                // Utilitaire pour extraire la valeur de chaque rang (centaines, dizaines, etc.)
                function getPlaceValuesMap(str) {
                    let pv = {};
                    let [intP, decP] = str.split(',');
                    if (intP) {
                        let len = intP.length;
                        for(let i=0; i<len; i++) {
                            let pwr = len - 1 - i;
                            pv[pwr] = parseFloat(intP[i] + '0'.repeat(pwr));
                        }
                    }
                    if (decP) {
                        let len = decP.length;
                        for(let i=0; i<len; i++) {
                            let pwr = -(i + 1);
                            pv[pwr] = parseFloat('0.' + '0'.repeat(i) + decP[i]);
                        }
                    }
                    return pv;
                }

                const getInput = (expected, pwr) => {
                    let expStr = expected.toString().replace('.', ',');
                    let w = Math.max(3, expStr.length + 1) + 'ch'; // Largeur dynamique selon la taille du nombre
                    if (isCorrection) {
                        let isErr = errors[`part_${pwr}`];
                        let cl = isErr ? "text-red-600 border-red-500 bg-red-50" : "text-emerald-700 border-emerald-500 bg-emerald-50";
                        return `<div class="inline-block text-center border-b-2 font-bold ${cl} py-1 mx-1 shadow-sm" style="width:${w}; min-width:3rem;">${expStr}</div>`;
                    } else {
                        return `<input type="text" class="text-center border-b-2 border-slate-400 focus:border-[#960018] outline-none bg-transparent font-bold text-lg tree-part-inp-${id} mx-1" data-expected="${expStr}" data-power="${pwr}" style="width:${w}; min-width:3rem;">`;
                    }
                };

                const getFinalInput = (expected) => {
                    let expStr = expected.toString().replace('.', ',');
                    let w = Math.max(4, expStr.length + 2) + 'ch';
                    if (isCorrection) {
                        let isErr = errors.final;
                        let cl = isErr ? "text-red-600 border-red-500 bg-red-50" : "text-emerald-700 border-emerald-500 bg-emerald-50";
                        return `<div class="inline-block text-center border-b-2 font-black text-xl ${cl} py-1 mx-1 shadow-sm" style="width:${w}; min-width:4rem;">${expStr}</div>`;
                    } else {
                        return `<input type="text" id="final-ans-${id}" class="text-center border-b-2 border-slate-400 focus:border-[#960018] outline-none bg-transparent font-black text-xl mx-1" data-expected="${expStr}" style="width:${w}; min-width:4rem;">`;
                    }
                };

                let html = `<div class="flex flex-col items-center justify-center w-full font-mono gap-5 py-6 overflow-x-auto min-w-max px-4 custom-scrollbar relative">`;

                if (c.op === '+') {
                    let pv1 = getPlaceValuesMap(c.n1Str);
                    let pv2 = getPlaceValuesMap(c.n2Str);
                    let allPowers = Array.from(new Set([...Object.keys(pv1), ...Object.keys(pv2)])).map(Number).sort((a,b) => b - a);
                    allPowers = allPowers.filter(pwr => pv1[pwr] !== 0 || pv2[pwr] !== 0); // Exclut les rangs à 0 des deux côtés
                    if(allPowers.length === 0) allPowers = [0];

                    // --- Ligne 1 : Décomposition ---
                    let l1Html = `<div class="flex items-center tracking-wider whitespace-nowrap text-sm md:text-lg">`;
                    let sums = [];
                    allPowers.forEach((pwr, idx) => {
                        let v1 = pv1[pwr] || 0;
                        let v2 = pv2[pwr] || 0;
                        sums.push(v1 + v2);
                        if(idx > 0) l1Html += `<span class="text-slate-500 font-bold mx-2">+</span>`;
                        l1Html += `( ${getInput(v1, 'a1_n1_'+pwr)} <span class="text-slate-500 mx-1">+</span> ${getInput(v2, 'a1_n2_'+pwr)} )`;
                    });
                    l1Html += `</div>`;
                    html += l1Html;

                    // --- Ligne 2 : Résultats intermédiaires ---
                    let l2Html = `<div class="flex items-center tracking-wider whitespace-nowrap text-sm md:text-lg">`;
                    sums.forEach((s, idx) => {
                        if(idx > 0) l2Html += `<span class="text-slate-500 font-bold mx-2">+</span>`;
                        l2Html += getInput(parseFloat(s.toFixed(4)), 'a2_'+idx);
                    });
                    l2Html += `</div>`;
                    html += l2Html;

                    // --- Ligne 3 : Total ---
                    html += `<div class="flex items-center tracking-wider mt-2">${getFinalInput(c.ans)}</div>`;

                } 
                else if (c.op === '*') {
                    let pv2 = getPlaceValuesMap(c.n2Str);
                    let p2Powers = Object.keys(pv2).map(Number).sort((a,b) => b - a).filter(pwr => pv2[pwr] !== 0);
                    if(p2Powers.length === 0) p2Powers = [0];

                    // --- Ligne 1 : Distribution ---
                    let l1Html = `<div class="flex items-center tracking-wider whitespace-nowrap text-sm md:text-lg">`;
                    p2Powers.forEach((pwr, idx) => {
                        let p2Val = pv2[pwr];
                        if(idx > 0) l1Html += `<span class="text-slate-500 font-bold mx-2">+</span>`;
                        l1Html += `( <span class="font-bold text-slate-700">${c.n1Str}</span> <span class="text-slate-500 mx-1">x</span> ${getInput(p2Val, 'm1_'+pwr)} )`;
                    });
                    l1Html += `</div>`;
                    html += l1Html;

                    // --- Ligne 2 : Produits calculés ---
                    let l2Html = `<div class="flex items-center tracking-wider whitespace-nowrap text-sm md:text-lg">`;
                    p2Powers.forEach((pwr, idx) => {
                        let p2Val = pv2[pwr];
                        let prod = parseFloat((c.n1 * p2Val).toFixed(4));
                        if(idx > 0) l2Html += `<span class="text-slate-500 font-bold mx-2">+</span>`;
                        l2Html += getInput(prod, 'm2_'+pwr);
                    });
                    l2Html += `</div>`;
                    html += l2Html;

                    // --- Ligne 3 : Total ---
                    html += `<div class="flex items-center tracking-wider mt-2">${getFinalInput(c.ans)}</div>`;

                }
                else if (c.op === '-') {
                    let pv2 = getPlaceValuesMap(c.n2Str);
                    let p2Powers = Object.keys(pv2).map(Number).sort((a,b) => b - a).filter(pwr => pv2[pwr] !== 0);
                    if(p2Powers.length === 0) p2Powers = [0];

                    // --- Ligne 1 : Décomposition de la soustraction ---
                    let l1Html = `<div class="flex items-center tracking-wider whitespace-nowrap text-sm md:text-lg">`;
                    l1Html += `<span class="font-bold text-slate-700 mr-2">${c.n1Str}</span>`;
                    p2Powers.forEach((pwr, idx) => {
                        l1Html += `<span class="text-slate-500 font-bold mx-2">-</span> ${getInput(pv2[pwr], 's1_'+pwr)}`;
                    });
                    l1Html += `</div>`;
                    html += l1Html;

                    // --- Lignes suivantes : Retraits successifs ---
                    let currentTotal = c.n1;
                    for (let i = 0; i < p2Powers.length; i++) {
                        currentTotal -= pv2[p2Powers[i]];
                        currentTotal = parseFloat(currentTotal.toFixed(4));
                        
                        let lineHtml = `<div class="flex items-center tracking-wider whitespace-nowrap text-sm md:text-lg">`;
                        if (i === p2Powers.length - 1) {
                            // Résultat final
                            lineHtml += getFinalInput(currentTotal);
                        } else {
                            // Résultat intermédiaire + on reporte les retraits grisés restants
                            lineHtml += getInput(currentTotal, 's2_'+i);
                            for (let j = i + 1; j < p2Powers.length; j++) {
                                let pStr = pv2[p2Powers[j]].toString().replace('.', ',');
                                lineHtml += `<span class="text-slate-400 font-bold mx-2 opacity-60">-</span> <span class="text-slate-400 font-bold opacity-60">${pStr}</span>`;
                            }
                        }
                        lineHtml += `</div>`;
                        html += lineHtml;
                    }
                }

                html += `</div>`;
                ws.innerHTML = html;

            } else {
                ws.innerHTML = dessinerGrille(id, isCorrection, errors);
            }
        }

        function vider(id) { document.querySelectorAll(`#workspace-${id} input, #workspace-${id} textarea`).forEach(i => i.value = ''); }

        function corriger(id) {
            let c = cardsData[id]; let isCorrect = true;
            let errors = {};

            if (c.format === 'arbre') {
                let inputs = document.querySelectorAll(`#workspace-${id} input.tree-part-inp-${id}`);
                inputs.forEach(inp => { 
                    if(inp.value.trim() !== inp.dataset.expected) {
                        isCorrect = false; 
                        errors[`part_${inp.dataset.power}`] = true;
                    }
                });
                let fAns = document.getElementById(`final-ans-${id}`);
                if(fAns && fAns.value.trim() !== c.ansStr) {
                    isCorrect = false;
                    errors.final = true;
                }
            }
            else if (c.format === 'trous') {
                let inputs = document.querySelectorAll(`#workspace-${id} input.trou-inp-${id}`);
                inputs.forEach(inp => { 
                    if(inp.value.trim() !== inp.dataset.expected) {
                        isCorrect = false; 
                        errors[inp.dataset.pos] = true;
                    }
                });
            } 
            else if(c.op === '/') {
                let uQ = parseFloat((document.getElementById(`quo-${id}`).value||'').replace(',','.'));
                let uR = parseFloat((document.getElementById(`rem-${id}`).value||'').replace(',','.'));
                uQ = isNaN(uQ) ? 0 : uQ; uR = isNaN(uR) ? 0 : uR;
                
                if(c.type === 'decimaux') { 
                    if(uQ !== c.ans) { isCorrect = false; errors.quo = true; }
                } else {
                    if(uQ !== c.ans) { isCorrect = false; errors.quo = true; }
                    if(uR !== c.rem) { isCorrect = false; errors.rem = true; }
                }
            } else {
                let cells = document.querySelectorAll(`#workspace-${id} .pose-inp-${id}`);
                cells.forEach(cell => {
                    let expectedChar = c.ansStr[cell.dataset.pos.split('_')[1]];
                    if(cell.value.trim() !== expectedChar && expectedChar !== ',') {
                         isCorrect = false;
                         errors[cell.dataset.pos] = true;
                    }
                });
                let prodCells = document.querySelectorAll(`#workspace-${id} .prod-inp-${id}`);
                prodCells.forEach(cell => {
                    if(cell.value.trim() !== cell.dataset.expected && cell.dataset.expected !== '') {
                         isCorrect = false;
                         errors[cell.dataset.pos] = true;
                    }
                });
                
                let str = Array.from(cells).map(cell => cell.value === '' ? '0' : cell.value).join('');
                let uAns = parseFloat(str.replace(',','.')); uAns = isNaN(uAns) ? 0 : uAns;
                if(uAns !== c.ans) isCorrect = false;
            }

            let badge = document.getElementById(`correction-badge-${id}`);
            renderWorkspace(id, true, errors);

            if(isCorrect) {
                badge.className = "px-6 py-2 rounded-full font-black text-sm md:text-base shadow bg-emerald-500 text-white";
                badge.innerHTML = `<i class="fa-solid fa-check mr-2"></i>BRAVO`;
            } else {
                badge.className = "px-6 py-2 rounded-full font-black text-sm md:text-base shadow bg-red-500 text-white";
                badge.innerHTML = `<i class="fa-solid fa-xmark mr-2"></i>ERREUR`;
            }
            
            document.getElementById(`card-container-${id}`).classList.add('flipped');
        }

        function retourner(id) {
            document.getElementById(`card-container-${id}`).classList.remove('flipped');
            setTimeout(() => {
                if(globalState.mode !== 'libre') genererUnProbleme(id); else vider(id);
            }, 600);
        }
    </script>
</body>
