<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculs Posés & Décompositions - Classe Adaptative</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
        }

        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .backface-hidden { backface-visibility: hidden; }
        
        .flipper {
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .flipped .flipper { transform: rotateY(180deg); }

        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            top: 0;
            left: 0;
        }

        .grid-math {
            display: grid;
            justify-content: center;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
        }

        .cell-input {
            width: 2.5rem;
            height: 2.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            text-align: center;
            font-weight: 800;
            font-size: 1.25rem;
            outline: none;
            transition: all 0.2s;
            background: white;
        }
        .cell-input:focus {
            border-color: #960018;
            box-shadow: 0 0 0 3px rgba(150, 0, 24, 0.1);
            z-index: 10;
        }
        .cell-static {
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.25rem;
        }
        .cell-carry {
            width: 1.5rem;
            height: 1.5rem;
            border: 1px dashed #cbd5e1;
            border-radius: 0.25rem;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            outline: none;
            background: #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }

        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }
        .animate-bounce-subtle { animation: bounce-subtle 2s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-[#960018] text-white p-4 shadow-lg shrink-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white p-2 rounded-xl shadow-inner">
                    <i class="fa-solid fa-calculator text-[#960018] text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black tracking-tight uppercase">Calculs Posés & <span class="text-white/80 font-light italic">Décompositions</span></h1>
                    <p class="text-[10px] uppercase tracking-[0.2em] font-bold opacity-70">Classe Adaptative</p>
                </div>
            </div>

            <div class="flex bg-black/20 p-1 rounded-xl backdrop-blur-sm border border-white/10">
                <button onclick="setPlayers(1)" class="player-btn px-4 py-2 rounded-lg font-bold text-sm transition bg-white text-[#960018] shadow" data-players="1">Individuel</button>
                <button onclick="setPlayers(2)" class="player-btn px-4 py-2 rounded-lg font-bold text-sm transition text-white" data-players="2">Duel</button>
                <button onclick="setPlayers(3)" class="player-btn px-4 py-2 rounded-lg font-bold text-sm transition text-white" data-players="3">Équipe</button>
                <button onclick="setPlayers(4)" class="player-btn px-4 py-2 rounded-lg font-bold text-sm transition text-white" data-players="4">Max</button>
            </div>
        </div>
    </header>

    <!-- Mode Selector & Timer -->
    <div class="bg-white border-b border-slate-200 p-3 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-center items-center gap-4 md:gap-8">
            <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                <button data-mode="entrainement" class="mode-btn px-5 py-2 rounded-lg font-bold text-sm transition bg-slate-800 text-white shadow">Entraînement</button>
                <button data-mode="libre" class="mode-btn px-5 py-2 rounded-lg font-bold text-sm transition text-slate-500">Libre</button>
                <button data-mode="sprint" class="mode-btn px-5 py-2 rounded-lg font-bold text-sm transition text-slate-500">Sprint</button>
                <button data-mode="representation" class="mode-btn px-5 py-2 rounded-lg font-bold text-sm transition text-slate-500">Représentation</button>
            </div>

            <div id="global-timer" class="hidden items-center gap-3 bg-red-50 px-4 py-2 rounded-xl border border-red-100 text-[#960018]">
                <i class="fa-solid fa-stopwatch text-xl animate-pulse"></i>
                <span class="font-black text-2xl tabular-nums">30</span>
            </div>
        </div>
    </div>

    <!-- Main Workspace -->
    <main class="flex-1 p-4 md:p-6 overflow-y-auto custom-scrollbar bg-slate-50">
        <div id="cards-container" class="grid gap-6 w-full max-w-4xl mx-auto">
            <!-- Cards will be injected here -->
        </div>
    </main>

    <script>
        let globalState = {
            mode: 'entrainement',
            playersCount: 1,
            timer: null,
            timeLeft: 30
        };

        let cardsData = [];

        // Initialisation
        function init() {
            setupGlobalListeners();
            setPlayers(1);
        }

        function setupGlobalListeners() {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.mode-btn').forEach(b => {
                        b.classList.remove('bg-slate-800', 'text-white', 'shadow');
                        b.classList.add('text-slate-500');
                    });
                    e.target.classList.remove('text-slate-500');
                    e.target.classList.add('bg-slate-800', 'text-white', 'shadow');
                    
                    globalState.mode = e.target.dataset.mode;
                    
                    const timerEl = document.getElementById('global-timer');
                    timerEl.classList.toggle('hidden', globalState.mode !== 'sprint');
                    timerEl.classList.toggle('flex', globalState.mode === 'sprint');

                    if (globalState.mode === 'sprint') {
                        startTimer();
                    } else {
                        stopTimer();
                    }
                    initAllGames();
                });
            });

            document.querySelectorAll('.player-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.player-btn').forEach(b => {
                        b.classList.remove('bg-white', 'text-[#960018]', 'shadow');
                        b.classList.add('text-white');
                    });
                    e.target.classList.remove('text-white');
                    e.target.classList.add('bg-white', 'text-[#960018]', 'shadow');
                    setPlayers(parseInt(e.target.dataset.players));
                });
            });
        }

        function startTimer() {
            stopTimer();
            globalState.timeLeft = 30;
            updateTimerUI();
            globalState.timer = setInterval(() => {
                globalState.timeLeft--;
                updateTimerUI();
                if (globalState.timeLeft <= 0) {
                    stopTimer();
                    for (let i = 0; i < globalState.playersCount; i++) {
                        corriger(i);
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            if (globalState.timer) clearInterval(globalState.timer);
        }

        function updateTimerUI() {
            const span = document.querySelector('#global-timer span');
            if (span) span.innerText = globalState.timeLeft;
            const container = document.getElementById('global-timer');
            if (globalState.timeLeft <= 10) {
                container.classList.add('bg-red-100', 'border-red-200');
            } else {
                container.classList.remove('bg-red-100', 'border-red-200');
            }
        }

        function setPlayers(count) {
            globalState.playersCount = count;
            const container = document.getElementById('cards-container');
            
            let gridClasses = {
                1: 'grid-cols-1 max-w-4xl mx-auto',
                2: 'grid-cols-1 lg:grid-cols-2 max-w-[98%] mx-auto',
                3: 'grid-cols-1 lg:grid-cols-3 max-w-[98%] mx-auto',
                4: 'grid-cols-1 lg:grid-cols-4 max-w-full px-2'
            };
            container.className = `grid gap-6 w-full ${gridClasses[count]}`;

            // Reset cardsData but keep existing if possible
            let newCardsData = [];
            for (let i = 0; i < count; i++) {
                if (cardsData[i]) {
                    newCardsData.push(cardsData[i]);
                } else {
                    newCardsData.push({
                        id: i,
                        n1: 0, n2: 0, ans: 0, rem: 0,
                        op: '+',
                        limit: 1000,
                        type: 'entiers',
                        format: 'pose',
                        rank: 1,
                        n1Str: '', n2Str: '', ansStr: '',
                        mask: null
                    });
                }
            }
            cardsData = newCardsData;

            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                container.innerHTML += createCardHTML(i);
            }
            initAllGames();
        }

        function createCardHTML(id) {
            let c = cardsData[id];
            let opSymbol = c.op === '*' ? 'x' : (c.op === '/' ? '÷' : c.op);
            
            return `
            <div class="perspective-1000 relative w-full flex flex-col min-h-[650px]" id="card-container-${id}">
                <div class="flipper w-full h-full absolute transform-style-3d">
                    
                    <!-- FRONT -->
                    <div class="front absolute w-full h-full bg-white rounded-3xl shadow-xl flex flex-col p-4 border-2 border-slate-100 overflow-hidden">
                        
                        <!-- Settings Bar -->
                        <div class="bg-slate-100 rounded-2xl mb-4 flex flex-wrap items-center gap-2 p-2 border border-slate-200 shadow-sm">
                            <select onchange="updateCardSettings(${id}, 'op', this.value)" class="bg-white border-2 border-[#960018] text-[#960018] rounded-xl h-10 px-2 font-black outline-none shadow-sm cursor-pointer">
                                <option value="+" ${c.op==='+'?'selected':''}>+</option>
                                <option value="-" ${c.op==='-'?'selected':''}>-</option>
                                <option value="*" ${c.op==='*'?'selected':''}>x</option>
                                <option value="/" ${c.op==='/'?'selected':''}>÷</option>
                            </select>

                            <select onchange="updateCardSettings(${id}, 'rank', this.value)" id="rank-select-${id}" class="bg-white border border-slate-300 rounded-xl h-10 px-2 font-bold text-slate-700 outline-none text-xs cursor-pointer" style="display: ${c.op === '*' || c.op === '/' ? 'inline-block' : 'none'};">
                                <option value="1" ${c.rank==1?'selected':''}>1 rang</option>
                                <option value="2" ${c.rank==2?'selected':''}>2 rangs</option>
                                <option value="3" ${c.rank==3?'selected':''}>3 rangs</option>
                                <option value="4" ${c.rank==4?'selected':''}>4 rangs</option>
                            </select>

                            <select onchange="updateCardSettings(${id}, 'format', this.value)" id="format-select-${id}" class="bg-white border border-slate-300 rounded-xl h-10 px-2 font-bold text-slate-700 outline-none text-xs cursor-pointer">
                                <option value="pose" ${c.format==='pose'?'selected':''}>Posé</option>
                                <option value="arbre" ${c.format==='arbre'?'selected':''} ${c.op==='/'?'disabled':''}>Arbre</option>
                                <option value="trous" ${c.format==='trous'?'selected':''} ${c.op==='/'?'disabled':''}>À trous</option>
                            </select>

                            <select onchange="updateCardSettings(${id}, 'type', this.value)" class="bg-blue-50 border border-blue-200 text-blue-800 rounded-xl h-10 px-2 font-bold outline-none text-xs cursor-pointer">
                                <option value="entiers" ${c.type==='entiers'?'selected':''}>Entiers</option>
                                <option value="decimaux" ${c.type==='decimaux'?'selected':''}>Décimaux</option>
                            </select>

                            <select onchange="updateCardSettings(${id}, 'limit', this.value)" class="bg-white border border-slate-300 rounded-xl h-10 px-2 font-bold text-slate-500 outline-none text-xs cursor-pointer">
                                <option value="10" ${c.limit==10?'selected':''}>&lt; 10</option>
                                <option value="100" ${c.limit==100?'selected':''}>&lt; 100</option>
                                <option value="1000" ${c.limit==1000?'selected':''}>&lt; 1 000</option>
                                <option value="10000" ${c.limit==10000?'selected':''}>&lt; 10 000</option>
                                <option value="100000" ${c.limit==100000?'selected':''}>&lt; 100 000</option>
                                <option value="1000000" ${c.limit==1000000?'selected':''}>&lt; 1 000 000</option>
                            </select>

                            <button onclick="genererUnProbleme(${id})" class="bg-slate-800 text-white h-10 w-10 rounded-xl font-bold shadow hover:bg-slate-700 transition flex items-center justify-center" title="Nouveau calcul">
                                <i class="fa-solid fa-rotate-right"></i>
                            </button>
                        </div>
                        
                        <!-- Banner Display -->
                        <div class="bg-[#0f172a] rounded-2xl text-white mb-4 shadow-inner h-20 flex items-center justify-center shrink-0 w-full ${globalState.mode === 'libre' ? 'hidden' : ''}" id="banner-${id}">
                            <h2 class="font-black tracking-widest text-center px-4 text-2xl md:text-3xl" id="op-display-${id}">---</h2>
                        </div>
                        
                        <!-- Libre Inputs -->
                        <div id="libre-inputs-${id}" class="${globalState.mode === 'libre' ? 'flex' : 'hidden'} justify-center items-center gap-3 mb-4 bg-slate-50 p-4 rounded-2xl border border-slate-200 flex-wrap">
                            <input type="number" step="any" id="libre-n1-${id}" placeholder="Nombre 1" class="w-full md:w-[40%] border-2 border-slate-300 rounded-xl p-3 text-center font-bold focus:border-[#960018] outline-none shadow-sm">
                            <span class="text-2xl font-black text-slate-400" id="libre-op-symbol-${id}">${opSymbol}</span>
                            <input type="number" step="any" id="libre-n2-${id}" placeholder="Nombre 2" class="w-full md:w-[40%] border-2 border-slate-300 rounded-xl p-3 text-center font-bold focus:border-[#960018] outline-none shadow-sm">
                            <button onclick="genererGrilleLibre(${id})" class="bg-[#960018] text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-red-800 transition w-full md:w-auto">
                                <i class="fa-solid fa-play mr-2"></i> POSER
                            </button>
                        </div>

                        <!-- Workspace -->
                        <div id="workspace-${id}" class="flex-1 bg-slate-50 rounded-3xl border-2 border-slate-200 flex flex-col items-center justify-center p-4 overflow-auto custom-scrollbar relative w-full min-h-[300px]">
                            <!-- Grid or Tree injected here -->
                        </div>

                        <!-- Actions -->
                        <div class="flex gap-3 mt-4 shrink-0 w-full">
                            <button onclick="corriger(${id})" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white text-xl font-black py-4 rounded-2xl shadow-lg transition transform hover:-translate-y-1 active:translate-y-0">
                                VÉRIFIER
                            </button>
                            <button onclick="vider(${id})" class="w-20 bg-white border-2 border-slate-200 text-red-500 hover:bg-red-50 text-xl font-bold py-4 rounded-2xl shadow transition flex items-center justify-center">
                                <i class="fa-solid fa-eraser"></i>
                            </button>
                        </div>
                    </div>

                    <!-- BACK (Correction) -->
                    <div class="back absolute w-full h-full bg-white rounded-3xl shadow-xl flex flex-col p-4 border-2 border-slate-100 rotate-y-180 overflow-hidden">
                        <div class="flex justify-between items-center mb-4 shrink-0 px-2">
                            <h3 class="font-black text-2xl text-slate-800 uppercase tracking-widest italic">Correction</h3>
                            <div id="correction-badge-${id}" class="px-6 py-2 rounded-full font-black text-base shadow text-white"></div>
                        </div>

                        <div class="flex-1 bg-emerald-50 border-2 border-emerald-100 rounded-3xl flex flex-col items-center justify-center overflow-auto relative p-4 w-full custom-scrollbar">
                            <div id="correct-grid-${id}" class="w-full h-full flex flex-col items-center justify-center origin-top p-2"></div>
                        </div>

                        <button onclick="retourner(${id})" class="mt-4 shrink-0 w-full bg-slate-900 hover:bg-slate-800 text-white text-xl font-black py-5 rounded-2xl shadow-xl transition flex items-center justify-center gap-3 group">
                            CONTINUER <i class="fa-solid fa-arrow-right group-hover:translate-x-2 transition"></i>
                        </button>
                    </div>
                </div>
            </div>`;
        }

        function updateCardSettings(id, key, value) {
            let c = cardsData[id];
            if (key === 'limit' || key === 'rank') value = parseInt(value);
            c[key] = value;
            
            if (key === 'op') {
                let formatSelect = document.getElementById(`format-select-${id}`);
                let rankSelect = document.getElementById(`rank-select-${id}`);
                
                if (value === '*' || value === '/') {
                    rankSelect.style.display = 'inline-block';
                } else {
                    rankSelect.style.display = 'none';
                }

                if (value === '/') {
                    formatSelect.value = 'pose'; 
                    c.format = 'pose'; 
                    formatSelect.disabled = true;
                } else {
                    formatSelect.disabled = false;
                }
                
                let sym = value === '*' ? 'x' : (value === '/' ? '÷' : value);
                let opSpan = document.getElementById(`libre-op-symbol-${id}`);
                if (opSpan) opSpan.innerText = sym;
            }
            if (globalState.mode !== 'libre') genererUnProbleme(id);
        }

        function initAllGames() {
            for (let i = 0; i < globalState.playersCount; i++) {
                const ws = document.getElementById(`workspace-${i}`);
                const banner = document.getElementById(`banner-${i}`);
                const libreInputs = document.getElementById(`libre-inputs-${i}`);
                if (!ws || !banner || !libreInputs) continue;

                if (globalState.mode === 'libre') {
                    ws.innerHTML = `
                        <div class="text-slate-300 font-bold text-center h-full flex flex-col items-center justify-center">
                            <i class="fa-solid fa-pen-nib text-6xl mb-4 opacity-30"></i>
                            <span class="text-lg uppercase tracking-widest">Saisissez vos nombres</span>
                        </div>`;
                    banner.classList.add('hidden');
                    libreInputs.classList.remove('hidden');
                    libreInputs.classList.add('flex');
                } else {
                    banner.classList.remove('hidden');
                    libreInputs.classList.add('hidden');
                    libreInputs.classList.remove('flex');
                    genererUnProbleme(i);
                }
            }
        }

        function getRandom(min, max, isDec) {
            let n = Math.random() * (max - min) + min;
            return isDec ? parseFloat(n.toFixed(2)) : Math.floor(n);
        }

        function genererUnProbleme(id) {
            if (globalState.mode === 'libre') { vider(id); return; }
            let c = cardsData[id];
            let isDec = c.type === 'decimaux';
            
            if (c.op === '+') { 
                c.n1 = getRandom(c.limit/10, c.limit, isDec); 
                c.n2 = getRandom(c.limit/100, c.limit, isDec); 
            } 
            else if (c.op === '-') { 
                c.n1 = getRandom(c.limit/10, c.limit, isDec); 
                c.n2 = getRandom(1, c.n1, isDec); 
            } 
            else if (c.op === '*') { 
                c.n1 = getRandom(2, c.limit/10, isDec); 
                let minR = 2, maxR = 9;
                if (c.rank == 2) { minR = 10; maxR = 99; }
                else if (c.rank == 3) { minR = 100; maxR = 999; }
                else if (c.rank == 4) { minR = 1000; maxR = 9999; }
                
                // For Arbre multiplication, we often want 1-digit multiplier for simpler distributivity
                if (c.format === 'arbre') { minR = 2; maxR = 9; }
                
                c.n2 = getRandom(minR, maxR, false); 
            } 
            else if (c.op === '/') {
                let minR = 2, maxR = 9;
                if (c.rank == 2) { minR = 10; maxR = 99; }
                else if (c.rank == 3) { minR = 100; maxR = 999; }
                else if (c.rank == 4) { minR = 1000; maxR = 9999; }
                c.n2 = getRandom(minR, maxR, false); 
                let q = getRandom(2, Math.min(999, Math.floor(c.limit/c.n2)), false);
                c.n1 = (c.n2 * q) + Math.floor(Math.random() * c.n2);
                if (isDec) c.n1 = parseFloat((c.n1 + getRandom(0.1, 0.9, true)).toFixed(2));
            }

            calculerReponse(id);
            if (c.format === 'trous') genererMasquesTrous(id);
            afficherBandeau(id);
            renderWorkspace(id, false);
        }

        function genererGrilleLibre(id) {
            let v1 = document.getElementById(`libre-n1-${id}`).value; 
            let v2 = document.getElementById(`libre-n2-${id}`).value;
            if (!v1 || !v2) return;
            cardsData[id].n1 = parseFloat(v1.replace(',', '.')); 
            cardsData[id].n2 = parseFloat(v2.replace(',', '.'));
            
            if (cardsData[id].op === '-' && cardsData[id].n1 < cardsData[id].n2) {
                alert("Le premier nombre doit être plus grand.");
                return;
            }
            calculerReponse(id); 
            if (cardsData[id].format === 'trous') genererMasquesTrous(id); 
            renderWorkspace(id, false);
        }

        function calculerReponse(id) {
            let c = cardsData[id];
            if (c.op === '+') c.ans = c.n1 + c.n2;
            if (c.op === '-') c.ans = c.n1 - c.n2;
            if (c.op === '*') c.ans = c.n1 * c.n2;
            if (c.op === '/') {
                if (c.type === 'entiers' && Number.isInteger(c.n1)) {
                    c.ans = Math.floor(c.n1/c.n2);
                    c.rem = c.n1 % c.n2;
                } else {
                    c.ans = parseFloat((c.n1/c.n2).toFixed(2));
                    c.rem = 0;
                }
            }
            if (c.op !== '/') c.ans = parseFloat(c.ans.toFixed(4));
            
            c.n1Str = c.n1.toString().replace('.', ',');
            c.n2Str = c.n2.toString().replace('.', ',');
            c.ansStr = c.ans.toString().replace('.', ',');
        }

        function genererMasquesTrous(id) {
            let c = cardsData[id];
            c.mask = { n1: [], n2: [], ans: [] };
            
            let cols = getCols(c.n1Str, c.n2Str);
            let s1Idx = cols - c.n1Str.length;
            let s2Idx = cols - c.n2Str.length;
            let sAnsIdx = cols - c.ansStr.length;
            
            for (let col = 0; col < cols; col++) {
                let options = [];
                if (col >= s1Idx && c.n1Str[col - s1Idx] !== ',') options.push('n1');
                if (col >= s2Idx && c.n2Str[col - s2Idx] !== ',') options.push('n2');
                if (col >= sAnsIdx && c.ansStr[col - sAnsIdx] !== ',') options.push('ans');
                
                if (options.length > 0 && Math.random() > 0.6) {
                    let chosen = options[Math.floor(Math.random() * options.length)];
                    if (chosen === 'n1') c.mask.n1.push(col - s1Idx);
                    else if (chosen === 'n2') c.mask.n2.push(col - s2Idx);
                    else if (chosen === 'ans') c.mask.ans.push(col - sAnsIdx);
                }
            }
        }

        function afficherBandeau(id) {
            let c = cardsData[id];
            let sym = c.op === '*' ? 'x' : (c.op === '/' ? '÷' : c.op);
            let dispN1 = c.n1Str;
            let dispN2 = c.n2Str;
            let dispAns = "";

            if (c.format === 'trous') {
                const applyMask = (str, mask) => str.split('').map((char, i) => mask && mask.includes(i) ? '.' : char).join('');
                dispN1 = applyMask(c.n1Str, c.mask?.n1);
                dispN2 = applyMask(c.n2Str, c.mask?.n2);
                dispAns = ` <span class="text-white/40 mx-2">=</span> ${applyMask(c.ansStr, c.mask?.ans)}`;
            }
            
            const opDisplay = document.getElementById(`op-display-${id}`);
            if (opDisplay) opDisplay.innerHTML = `${dispN1} <span class="text-[#960018] mx-2">${sym}</span> ${dispN2}${dispAns}`;
        }

        function getCols(s1, s2) {
            let p1 = s1.split(','); let p2 = s2.split(',');
            let mI = Math.max(p1[0].length, p2[0].length);
            let mD = Math.max((p1[1]||'').length, (p2[1]||'').length);
            return mI + mD + (mD > 0 ? 1 : 0) + 2; 
        }

        function renderBlocksHTML(num) {
            if (num > 5000) return `<div class="text-red-500 font-bold">Nombre trop grand (>5000)</div>`;
            let n = Math.floor(num);
            const m = Math.floor(n / 1000); n %= 1000;
            const c = Math.floor(n / 100); n %= 100;
            const d = Math.floor(n / 10);
            const u = n % 10;

            const createCube = (x, y, color, size = 10) => {
                const s = size;
                return `<g transform="translate(${x},${y})">
                    <path d="M0,${s/2} L${s},0 L${2*s},${s/2} L${s},${s} Z" fill="${color.top}" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
                    <path d="M0,${s/2} L0,${1.5*s} L${s},${2*s} L${s},${s} Z" fill="${color.left}" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
                    <path d="M${s},${s} L${s},${2*s} L${2*s},${1.5*s} L${2*s},${s/2} Z" fill="${color.right}" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
                </g>`;
            };

            const colors = {
                u: { top: '#fef08a', left: '#fde047', right: '#facc15' },
                d: { top: '#bfdbfe', left: '#60a5fa', right: '#2563eb' },
                c: { top: '#bbf7d0', left: '#4ade80', right: '#16a34a' },
                m: { top: '#fecaca', left: '#f87171', right: '#dc2626' }
            };

            let svg = `<svg viewBox="0 0 400 250" class="w-full h-full" preserveAspectRatio="xMidYMid meet">`;
            
            // Milliers (Rouge) - Stacks
            for (let i = 0; i < m; i++) {
                svg += createCube(10 + (i * 50), 20, colors.m, 22);
            }

            // Centaines (Vert) - Grid
            for (let i = 0; i < c; i++) {
                let row = Math.floor(i / 5);
                let col = i % 5;
                svg += createCube(180 + (col * 40), 20 + (row * 30), colors.c, 16);
            }

            // Dizaines (Bleu) - Row
            for (let i = 0; i < d; i++) {
                let row = Math.floor(i / 5);
                let col = i % 5;
                svg += createCube(10 + (col * 30), 140 + (row * 25), colors.d, 12);
            }

            // Unités (Jaune) - Cluster
            for (let i = 0; i < u; i++) {
                let row = Math.floor(i / 5);
                let col = i % 5;
                svg += createCube(180 + (col * 25), 140 + (row * 20), colors.u, 10);
            }

            return svg + `</svg>`;
        }

        function renderWorkspace(id, isCorrection, errors = {}) {
            let c = cardsData[id];
            const ws = document.getElementById(isCorrection ? `correct-grid-${id}` : `workspace-${id}`);
            if (!ws) return;
            
            if (globalState.mode === 'representation') {
                let sym = c.op === '*' ? 'x' : (c.op === '/' ? '÷' : c.op);
                if (isCorrection) {
                    let isErr = errors.final;
                    let cl = isErr ? "border-red-500 bg-red-50 text-red-700" : "border-emerald-500 bg-emerald-50 text-emerald-700";
                    ws.innerHTML = `
                        <div class="flex flex-col items-center gap-4 w-full h-full p-2">
                            <div class="flex items-center justify-center gap-4 w-full flex-1 min-h-0">
                                <div class="flex-1 h-full min-h-[150px]">${renderBlocksHTML(c.n1)}</div>
                                <div class="text-4xl font-black text-[#960018]">${sym}</div>
                                <div class="flex-1 h-full min-h-[150px]">${renderBlocksHTML(c.n2)}</div>
                            </div>
                            <div class="w-full max-w-xs text-center p-4 rounded-2xl border-4 ${cl} font-black text-4xl shadow-lg">
                                ${c.ansStr}
                            </div>
                        </div>
                    `;
                } else {
                    ws.innerHTML = `
                        <div class="flex flex-col items-center gap-4 w-full h-full p-2">
                            <div class="flex items-center justify-center gap-4 w-full flex-1 min-h-0">
                                <div class="flex-1 h-full min-h-[150px]">${renderBlocksHTML(c.n1)}</div>
                                <div class="text-4xl font-black text-[#960018]">${sym}</div>
                                <div class="flex-1 h-full min-h-[150px]">${renderBlocksHTML(c.n2)}</div>
                            </div>
                            <div class="w-full max-w-xs">
                                <input type="text" id="rep-ans-${id}" class="w-full border-4 border-slate-200 rounded-2xl p-4 text-center font-black text-3xl focus:border-[#960018] outline-none shadow-inner" placeholder="Résultat ?">
                            </div>
                        </div>
                    `;
                }
                return;
            }

            if (c.format === 'arbre') {
                renderArbre(id, ws, isCorrection, errors);
            } else if (c.op === '/') {
                renderDivision(id, ws, isCorrection, errors);
            } else {
                ws.innerHTML = dessinerGrille(id, isCorrection, errors);
            }
        }

        function renderDivision(id, ws, isCorrection, errors) {
            let c = cardsData[id];
            if (isCorrection) {
                let qClass = "pt-2 font-black text-2xl tracking-widest w-full px-3 py-2 rounded-xl " + (errors.quo ? "bg-red-100 text-red-800 border-2 border-red-500" : "bg-blue-100 text-blue-800");
                let rClass = "font-bold mt-4 inline-block px-4 py-1 rounded-full text-sm " + (errors.rem ? "bg-red-100 text-red-800 border-2 border-red-500" : "bg-emerald-100 text-emerald-700 border-2 border-emerald-300");

                ws.innerHTML = `
                    <div class="flex w-full max-w-[400px] mx-auto items-start font-mono">
                        <div class="flex-1 pr-4 border-r-4 border-slate-800 text-right">
                            <div class="tracking-[0.3em] font-black text-3xl text-slate-800 mb-8">${c.n1Str}</div>
                            <div class="text-slate-400 italic text-xs mb-4">Calculs intermédiaires...</div>
                            <div class="${rClass}">Reste : ${c.rem}</div>
                        </div>
                        <div class="flex-1 pl-4 flex flex-col items-start">
                            <div class="border-b-4 border-slate-800 pb-2 w-full font-black text-3xl tracking-[0.3em] text-slate-800 mb-4">${c.n2Str}</div>
                            <div class="${qClass}">${c.ansStr}</div>
                        </div>
                    </div>`;
            } else {
                ws.innerHTML = `
                    <div class="flex w-full font-mono max-w-[450px] mx-auto min-h-[250px]">
                        <div class="flex-1 pr-4 flex flex-col items-end border-r-4 border-slate-300 relative">
                            <div class="tracking-[0.3em] font-black text-3xl mb-6 text-slate-800">${c.n1Str}</div>
                            <textarea class="w-full flex-1 bg-white border-2 border-slate-200 rounded-2xl resize-none outline-none text-right text-base text-slate-500 custom-scrollbar p-3" placeholder="Sous-tractions..."></textarea>
                            <div class="mt-4 flex items-center gap-3">
                                <span class="font-black text-red-600 uppercase text-xs tracking-widest">Reste</span>
                                <input type="number" step="any" id="rem-${id}" class="cell-input w-24 border-red-300 text-red-700 focus:border-red-600 shadow-sm" style="height:3rem; font-size:1.5rem;">
                            </div>
                        </div>
                        <div class="flex-1 pl-4 flex flex-col relative">
                            <div class="border-b-4 border-slate-800 pb-2 font-black text-3xl tracking-[0.3em] text-slate-800 mb-4">${c.n2Str}</div>
                            <div class="pt-4">
                                <input type="number" step="any" id="quo-${id}" class="cell-input w-full bg-blue-50 border-blue-300 text-blue-800 tracking-widest focus:border-blue-600 font-black shadow-sm" placeholder="Quotient" style="height:4rem; font-size:1.8rem;">
                            </div>
                        </div>
                    </div>`;
            }
        }

        function renderArbre(id, ws, isCorrection, errors) {
            let c = cardsData[id];
            
            function getPlaceValuesMap(str) {
                let pv = {};
                let [intP, decP] = str.split(',');
                if (intP) {
                    let len = intP.length;
                    for (let i = 0; i < len; i++) {
                        let pwr = len - 1 - i;
                        pv[pwr] = parseFloat(intP[i] + '0'.repeat(pwr));
                    }
                }
                if (decP) {
                    for (let i = 0; i < decP.length; i++) {
                        let pwr = -(i + 1);
                        pv[pwr] = parseFloat('0.' + '0'.repeat(i) + decP[i]);
                    }
                }
                return pv;
            }

            const getInput = (expected, pwr) => {
                let expStr = expected.toString().replace('.', ',');
                let w = Math.max(3, expStr.length + 1) + 'ch';
                if (isCorrection) {
                    let isErr = errors[`part_${pwr}`];
                    let cl = isErr ? "text-red-600 border-red-500 bg-red-50" : "text-emerald-700 border-emerald-500 bg-emerald-50";
                    return `<div class="inline-block text-center border-b-2 font-bold ${cl} py-1 mx-1 shadow-sm" style="min-width:3rem; width:${w}">${expStr}</div>`;
                } else {
                    return `<input type="text" class="text-center border-b-2 border-slate-400 focus:border-[#960018] outline-none bg-transparent font-bold text-lg tree-part-inp-${id} mx-1" data-expected="${expStr}" data-power="${pwr}" style="min-width:3rem; width:${w}">`;
                }
            };

            const getFinalInput = (expected) => {
                let expStr = expected.toString().replace('.', ',');
                let w = Math.max(4, expStr.length + 2) + 'ch';
                if (isCorrection) {
                    let isErr = errors.final;
                    let cl = isErr ? "text-red-600 border-red-500 bg-red-50" : "text-emerald-700 border-emerald-500 bg-emerald-50";
                    return `<div class="inline-block text-center border-b-2 font-black text-2xl ${cl} py-2 mx-1 shadow-sm" style="min-width:5rem; width:${w}">${expStr}</div>`;
                } else {
                    return `<input type="text" id="final-ans-${id}" class="text-center border-b-2 border-slate-400 focus:border-[#960018] outline-none bg-transparent font-black text-2xl mx-1" data-expected="${expStr}" style="min-width:5rem; width:${w}">`;
                }
            };

            let html = `<div class="flex flex-col items-center justify-center w-full font-mono gap-6 py-8 overflow-x-auto custom-scrollbar relative">`;

            if (c.op === '+') {
                let pv1 = getPlaceValuesMap(c.n1Str);
                let pv2 = getPlaceValuesMap(c.n2Str);
                let allPowers = Array.from(new Set([...Object.keys(pv1), ...Object.keys(pv2)])).map(Number).sort((a,b) => b - a);
                allPowers = allPowers.filter(pwr => pv1[pwr] !== 0 || pv2[pwr] !== 0);
                if (allPowers.length === 0) allPowers = [0];

                // Line 1: Decomposed sums
                let l1Html = `<div class="flex items-center tracking-wider whitespace-nowrap text-lg">`;
                let sums = [];
                allPowers.forEach((pwr, idx) => {
                    let v1 = pv1[pwr] || 0;
                    let v2 = pv2[pwr] || 0;
                    sums.push(v1 + v2);
                    if (idx > 0) l1Html += `<span class="text-slate-400 font-bold mx-3">+</span>`;
                    l1Html += `( ${getInput(v1, 'a1_n1_'+pwr)} <span class="text-slate-400 mx-1">+</span> ${getInput(v2, 'a1_n2_'+pwr)} )`;
                });
                l1Html += `</div>`;
                html += l1Html;

                // Line 2: Intermediate results
                let l2Html = `<div class="flex items-center tracking-wider whitespace-nowrap text-lg">`;
                sums.forEach((s, idx) => {
                    if (idx > 0) l2Html += `<span class="text-slate-400 font-bold mx-3">+</span>`;
                    l2Html += getInput(parseFloat(s.toFixed(4)), 'a2_'+idx);
                });
                l2Html += `</div>`;
                html += l2Html;

                // Line 3: Final Total
                html += `<div class="flex items-center tracking-wider mt-4">${getFinalInput(c.ans)}</div>`;
            } 
            else if (c.op === '*') {
                // DISTRIBUTIVITY LOGIC
                let n2StrClean = c.n2.toString().replace('.', ',');
                let n2Digits = n2StrClean.replace(',', '').length;
                
                let decomposedStr, fixedNum;
                // Decompose the multi-digit number, keep the 1-digit one fixed
                if (n2Digits === 1) {
                    decomposedStr = c.n1Str;
                    fixedNum = c.n2;
                } else {
                    decomposedStr = c.n2Str;
                    fixedNum = c.n1;
                }

                let pv = getPlaceValuesMap(decomposedStr);
                let powers = Object.keys(pv).map(Number).sort((a,b) => b - a).filter(pwr => pv[pwr] !== 0);
                if (powers.length === 0) powers = [0];

                // Line 1: (Part1 x Fixed) + (Part2 x Fixed) ...
                let l1Html = `<div class="flex items-center tracking-wider whitespace-nowrap text-lg">`;
                powers.forEach((pwr, idx) => {
                    let decVal = pv[pwr];
                    if (idx > 0) l1Html += `<span class="text-slate-400 font-bold mx-3">+</span>`;
                    l1Html += `( ${getInput(decVal, 'm1_dec_'+pwr)} <span class="text-slate-400 mx-1">x</span> ${getInput(fixedNum, 'm1_fix_'+pwr)} )`;
                });
                l1Html += `</div>`;
                html += l1Html;

                // Line 2: Partial products
                let l2Html = `<div class="flex items-center tracking-wider whitespace-nowrap text-lg">`;
                powers.forEach((pwr, idx) => {
                    let decVal = pv[pwr];
                    let prod = parseFloat((decVal * fixedNum).toFixed(4));
                    if (idx > 0) l2Html += `<span class="text-slate-400 font-bold mx-3">+</span>`;
                    l2Html += getInput(prod, 'm2_'+pwr);
                });
                l2Html += `</div>`;
                html += l2Html;

                // Line 3: Final Total
                html += `<div class="flex items-center tracking-wider mt-4">${getFinalInput(c.ans)}</div>`;
            }
            else if (c.op === '-') {
                let pv2 = getPlaceValuesMap(c.n2Str);
                let p2Powers = Object.keys(pv2).map(Number).sort((a,b) => b - a).filter(pwr => pv2[pwr] !== 0);
                if (p2Powers.length === 0) p2Powers = [0];

                // Line 1: N1 - Part1 - Part2 ...
                let l1Html = `<div class="flex items-center tracking-wider whitespace-nowrap text-lg">`;
                l1Html += `<span class="font-black text-slate-800 mr-3">${c.n1Str}</span>`;
                p2Powers.forEach((pwr) => {
                    l1Html += `<span class="text-slate-400 font-bold mx-3">-</span> ${getInput(pv2[pwr], 's1_'+pwr)}`;
                });
                l1Html += `</div>`;
                html += l1Html;

                // Successive subtractions
                let currentTotal = c.n1;
                for (let i = 0; i < p2Powers.length; i++) {
                    currentTotal -= pv2[p2Powers[i]];
                    currentTotal = parseFloat(currentTotal.toFixed(4));
                    
                    let lineHtml = `<div class="flex items-center tracking-wider whitespace-nowrap text-lg">`;
                    if (i === p2Powers.length - 1) {
                        lineHtml += getFinalInput(currentTotal);
                    } else {
                        lineHtml += getInput(currentTotal, 's2_'+i);
                        for (let j = i + 1; j < p2Powers.length; j++) {
                            let pStr = pv2[p2Powers[j]].toString().replace('.', ',');
                            lineHtml += `<span class="text-slate-300 font-bold mx-3 opacity-50">-</span> <span class="text-slate-300 font-bold opacity-50">${pStr}</span>`;
                        }
                    }
                    lineHtml += `</div>`;
                    html += lineHtml;
                }
            }

            html += `</div>`;
            ws.innerHTML = html;
        }

        function dessinerGrille(id, isCorrection, errors = {}) {
            let c = cardsData[id];
            let cellW = globalState.playersCount >= 3 && !isCorrection ? '1.8rem' : '2.5rem';
            let cellF = '1.25rem';
            let cols = getCols(c.n1Str, c.n2Str);
            
            // For multiplication, we might need more columns
            if (c.op === '*') {
                cols = Math.max(c.n1Str.length, c.n2Str.length) + 4;
            }

            let html = `<div class="grid-math" style="grid-template-columns: repeat(${cols}, ${cellW}); column-gap: 0; row-gap: 0.2rem;">`;

            // Carry Row
            for (let i = 0; i < cols; i++) {
                html += isCorrection ? `<div></div>` : `<input type="text" maxlength="1" class="cell-carry mb-2" style="width:1.5rem; height:1.5rem;">`;
            }

            // Number 1 Row
            let s1Idx = cols - c.n1Str.length;
            for (let i = 0; i < cols; i++) {
                if (i >= s1Idx) {
                    let cIdx = i - s1Idx;
                    let char = c.n1Str[cIdx];
                    if (isCorrection && c.format === 'trous' && c.mask.n1.includes(cIdx)) {
                        let cl = errors[`n1_${cIdx}`] ? "border-red-500 bg-red-100 text-red-900" : "border-emerald-500 bg-emerald-100 text-emerald-900";
                        html += `<div class="cell-input shadow-sm flex items-center justify-center font-black ${cl}" style="width:${cellW}">${char}</div>`;
                    } else if (c.format === 'trous' && c.mask.n1.includes(cIdx) && !isCorrection) {
                        html += `<input type="text" maxlength="1" class="cell-input trou-inp-${id} border-orange-300 bg-orange-50" data-expected="${char}" data-pos="n1_${cIdx}" style="width:${cellW}">`;
                    } else {
                        html += `<div class="cell-static ${char===','?'text-red-500':''}" style="width:${cellW}">${char}</div>`;
                    }
                } else html += `<div></div>`;
            }

            // Number 2 Row (with Operator)
            let s2Idx = cols - c.n2Str.length;
            for (let i = 0; i < cols; i++) {
                let border = "pb-2 mb-2 w-full flex justify-center";
                let sym = c.op === '*' ? 'x' : c.op;
                if (i === 0) {
                    html += `<div class="cell-static text-[#960018] font-black ${border}" style="width:${cellW}">${sym}</div>`;
                } else if (i >= s2Idx) {
                    let cIdx = i - s2Idx;
                    let char = c.n2Str[cIdx];
                    if (isCorrection && c.format === 'trous' && c.mask.n2.includes(cIdx)) {
                        let cl = errors[`n2_${cIdx}`] ? "border-red-500 bg-red-100 text-red-900" : "border-emerald-500 bg-emerald-100 text-emerald-900";
                        html += `<div class="${border}"><div class="cell-input shadow-sm flex items-center justify-center font-black ${cl}" style="width:${cellW}">${char}</div></div>`;
                    } else if (c.format === 'trous' && c.mask.n2.includes(cIdx) && !isCorrection) {
                        html += `<div class="${border}"><input type="text" maxlength="1" class="cell-input trou-inp-${id} border-orange-300 bg-orange-50" data-expected="${char}" data-pos="n2_${cIdx}" style="width:${cellW}"></div>`;
                    } else {
                        html += `<div class="cell-static ${char===','?'text-red-500':''} ${border}" style="width:${cellW}">${char}</div>`;
                    }
                } else html += `<div class="${border}"></div>`;
            }

            // Multiplication Partial Products
            if (c.op === '*') {
                let s2Clean = c.n2Str.replace(',', '');
                if (s2Clean.length > 1) {
                    for (let i = 0; i < s2Clean.length; i++) {
                        let digit = parseInt(s2Clean[s2Clean.length - 1 - i]);
                        let prod = (parseInt(c.n1Str.replace(',', '')) * digit).toString();
                        let prodPadded = prod.padStart(cols - i, ' ');
                        
                        for (let col = 0; col < cols; col++) {
                            if (col < cols - i) {
                                let val = prodPadded[col];
                                if (isCorrection) {
                                    let cl = errors[`prod_${i}_${col}`] ? "border-red-500 bg-red-100 text-red-900" : "text-blue-700";
                                    html += `<div class="cell-static ${cl}" style="width:${cellW}">${val?.trim() ? val : ''}</div>`;
                                } else if (c.format === 'trous') {
                                    html += `<div class="cell-static text-blue-700" style="width:${cellW}">${val?.trim() ? val : ''}</div>`;
                                } else {
                                    html += `<input type="text" maxlength="1" class="cell-input border-slate-200 bg-white p-0 prod-inp-${id}" data-expected="${val?.trim() ? val : ''}" data-pos="prod_${i}_${col}" style="width:${cellW}; height:2.2rem;">`;
                                }
                            } else {
                                html += `<div class="cell-static text-slate-300 font-black opacity-50" style="width:${cellW}">0</div>`;
                            }
                        }
                    }
                    // Final addition line
                    for (let i = 0; i < cols; i++) {
                        let border = "border-t-2 border-black border-solid pt-2 mt-2 w-full flex justify-center";
                        html += i === 0 ? `<div class="cell-static text-[#960018] font-black ${border}" style="width:${cellW}">+</div>` : `<div class="${border}"></div>`;
                    }
                }
            }

            // Result Row
            let sAnsIdx = cols - c.ansStr.length;
            let resBorder = "border-t-2 border-black border-solid w-full flex justify-center";
            for (let i = 0; i < cols; i++) {
                let cellHtml = "";
                if (i >= sAnsIdx) {
                    let cIdx = i - sAnsIdx;
                    let char = c.ansStr[cIdx];
                    if (isCorrection) {
                        let isErr = false;
                        if (c.format === 'trous' && c.mask.ans.includes(cIdx)) isErr = errors[`ans_${cIdx}`];
                        else if (c.format === 'pose') isErr = errors[`ans_${cIdx}`];
                        
                        let cl = isErr ? "border-red-500 bg-red-100 text-red-900" : "border-emerald-500 bg-emerald-100 text-emerald-900";
                        cellHtml = `<div class="cell-input shadow-md flex items-center justify-center font-black ${cl}" style="width:${cellW}">${char}</div>`;
                    } else if (c.format === 'trous') {
                        if (c.mask.ans.includes(cIdx)) {
                            cellHtml = `<input type="text" maxlength="1" class="cell-input trou-inp-${id} border-orange-300 bg-orange-50" data-expected="${char}" data-pos="ans_${cIdx}" style="width:${cellW}">`;
                        } else {
                            cellHtml = `<div class="cell-static text-blue-800" style="width:${cellW}">${char}</div>`;
                        }
                    } else {
                        cellHtml = `<input type="text" maxlength="1" class="cell-input pose-inp-${id} focus:border-[#960018]" data-pos="ans_${cIdx}" style="width:${cellW}">`;
                    }
                } else {
                    cellHtml = `<div style="width:${cellW}"></div>`;
                }
                html += `<div class="${resBorder} pt-2 mt-2">${cellHtml}</div>`;
            }

            html += `</div>`;
            return html;
        }

        function vider(id) {
            document.querySelectorAll(`#workspace-${id} input, #workspace-${id} textarea`).forEach(i => i.value = '');
        }

        function corriger(id) {
            let c = cardsData[id];
            let isCorrect = true;
            let errors = {};

            if (c.format === 'arbre') {
                let inputs = document.querySelectorAll(`#workspace-${id} input.tree-part-inp-${id}`);
                inputs.forEach(inp => { 
                    let val = inp.value.trim().replace(',', '.');
                    let exp = (inp.dataset.expected || '').replace(',', '.');
                    if (val !== exp && parseFloat(val) !== parseFloat(exp)) {
                        isCorrect = false; 
                        errors[`part_${inp.dataset.power}`] = true;
                    }
                });
                let fAns = document.getElementById(`final-ans-${id}`);
                if (fAns) {
                    let val = fAns.value.trim().replace(',', '.');
                    let exp = (fAns.dataset.expected || '').replace(',', '.');
                    if (val !== exp && parseFloat(val) !== parseFloat(exp)) {
                        isCorrect = false;
                        errors.final = true;
                    }
                }
            }
            else if (globalState.mode === 'representation') {
                let input = document.getElementById(`rep-ans-${id}`);
                if (input) {
                    let val = input.value.trim().replace(',', '.');
                    if (parseFloat(val) !== c.ans) {
                        isCorrect = false;
                        errors.final = true;
                    }
                }
            }
            else if (c.format === 'trous') {
                let inputs = document.querySelectorAll(`#workspace-${id} input.trou-inp-${id}`);
                inputs.forEach(inp => { 
                    if (inp.value.trim() !== inp.dataset.expected) {
                        isCorrect = false; 
                        errors[inp.dataset.pos] = true;
                    }
                });
            } 
            else if (c.op === '/') {
                let uQ = parseFloat((document.getElementById(`quo-${id}`).value || '').replace(',', '.'));
                let uR = parseFloat((document.getElementById(`rem-${id}`).value || '').replace(',', '.'));
                uQ = isNaN(uQ) ? 0 : uQ; uR = isNaN(uR) ? 0 : uR;
                
                if (c.type === 'decimaux') { 
                    if (uQ !== c.ans) { isCorrect = false; errors.quo = true; }
                } else {
                    if (uQ !== c.ans) { isCorrect = false; errors.quo = true; }
                    if (uR !== c.rem) { isCorrect = false; errors.rem = true; }
                }
            } else {
                let cells = document.querySelectorAll(`#workspace-${id} .pose-inp-${id}`);
                cells.forEach(cell => {
                    let expectedChar = c.ansStr[cell.dataset.pos.split('_')[1]];
                    if (cell.value.trim() !== expectedChar && expectedChar !== ',') {
                         isCorrect = false;
                         errors[cell.dataset.pos] = true;
                    }
                });
                let prodCells = document.querySelectorAll(`#workspace-${id} .prod-inp-${id}`);
                prodCells.forEach(cell => {
                    if (cell.value.trim() !== cell.dataset.expected && cell.dataset.expected !== '') {
                         isCorrect = false;
                         errors[cell.dataset.pos] = true;
                    }
                });
                
                let str = Array.from(cells).map(cell => cell.value === '' ? '0' : cell.value).join('');
                let uAns = parseFloat(str.replace(',', '.')); uAns = isNaN(uAns) ? 0 : uAns;
                if (uAns !== c.ans) isCorrect = false;
            }

            let badge = document.getElementById(`correction-badge-${id}`);
            renderWorkspace(id, true, errors);

            if (badge) {
                if (isCorrect) {
                    badge.className = "px-6 py-2 rounded-full font-black text-base shadow bg-emerald-500 text-white";
                    badge.innerHTML = `<i class="fa-solid fa-check mr-2"></i>BRAVO !`;
                } else {
                    badge.className = "px-6 py-2 rounded-full font-black text-base shadow bg-red-500 text-white";
                    badge.innerHTML = `<i class="fa-solid fa-xmark mr-2"></i>ERREUR`;
                }
            }
            
            const cardContainer = document.getElementById(`card-container-${id}`);
            if (cardContainer) cardContainer.classList.add('flipped');
        }

        function retourner(id) {
            const cardContainer = document.getElementById(`card-container-${id}`);
            if (cardContainer) cardContainer.classList.remove('flipped');
            if (globalState.mode !== 'libre') genererUnProbleme(id);
        }

        // Run on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
